name: Bug
description: Something in Trait Facts does not work.
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: A few sentences are enough. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Version info
      description: Optional. The bug icon at the top of the Trait Facts overview copies it; paste it here.
      render: text
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Please do not post your whole console.txt: it shows your Windows user name. If you want to add log lines, copy only the ones that contain TraitFacts.
