name: Translation
description: A text in your language reads wrong or unclear.
labels: ["translation"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - German
        - Russian
        - Simplified Chinese
        - Brazilian Portuguese
        - Spanish
        - French
        - Polish
        - Korean
        - Japanese
        - Turkish
        - Italian
        - English
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: The text as it shows in the game, and how it should read. A screenshot works too.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        If you prefer to edit the file yourself and open a pull request, CONTRIBUTING.md has the steps.
