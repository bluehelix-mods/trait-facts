name: Wrong number
description: A number that Trait Facts shows looks wrong.
labels: ["wrong-number"]
body:
  - type: textarea
    id: what
    attributes:
      label: Which trait and which number
      description: For example "Strong, carry capacity x1.5, but my character only carries 18".
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: How you know
      description: Optional. What you saw in the game, or where in the game code it is. The wiki shows where each number comes from, https://bluehelix-mods.github.io/trait-facts/
    validations:
      required: false
