# Veroeffentlicht das Wiki (docs/wiki) als GitHub Pages, bei jedem Push auf
# main, der das Wiki aendert. Nur dieser Ordner geht auf die Seite; Berichte,
# Messprotokolle und Mockups bleiben im Repo, aber nicht auf der Webseite.
#
# Sicherheit: laeuft nur auf main und von Hand, nie fuer Pull-Requests aus
# Forks; keine Geheimnisse; die Aktionen sind auf feste Commits festgenagelt,
# damit ein verschobener Tag keinen fremden Code einschleust.
name: Wiki

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/wiki
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
