<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Every number the Project Zomboid mod Trait Facts shows, where it comes from and how it was checked.">

<style>
/* Eine Welt, die des Mods: der fast schwarze Grund von Poster und Panel, das
   Blau der Ueberschriftenlinie (0.45, 0.72, 1.0), Gruen und Rot der Werte,
   das Grau der Hinweise, das Orange fuer Veraltetes (TF.fmt.rgb in
   TF_Tooltip.lua). Kaestchen mit Rand und ohne Flaeche wie die Kuerzel im
   Spiel, Streifen hinter jeder zweiten Zeile wie in der Uebersicht. Bewusst
   nur dunkel: so sieht Trait Facts im Spiel aus. Keine Schriften von aussen.

   Aufbau seit 21.09.2026 (vier Kritiken: Erstbesucher, Aufbau, UI, Modder):
   oben an jedem Wert steht, was ein Spieler braucht (Zahl in Gut/Schlecht-Farbe,
   Wirkung, Stand, Klartext); der Beleg liegt darunter, zugeklappt. --note und
   --off sind so hell, dass jeder Text AA haelt (5.9 und 4.5 auf dem Streifen).
   Grund, Flaechen, Linien, Blau, Gruen und Rot seit 22.09.2026 wie die CI
   (docs/veroeffentlichung/ci.html); die Vierecke alle gefuellt. */
:root{
  color-scheme:dark;
  --ground:#0a0a0a; --panel:#101010; --raised:#141414; --stripe:rgba(255,255,255,.05);
  --rule:#262626; --rule-strong:#666666;
  --label:#ffffff; --value:#d9d9d9; --note:#9a9a9a; --off:#858585;
  --blue:#73b8ff; --good:#73b87a; --bad:#d17f78; --stale:#ffbf4d; --source:#b8a6db;
  /* Die Spalte der Zahl, gemeinsam fuer Kopf und Belegzeilen: beides beginnt in einer Flucht. */
  --col:10rem;
  /* Hoehe der klebenden Kopfzeile, fuer Seitenleiste und Sprungziele. */
  --top:3.5rem;
}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--value);
  font:400 15px/1.6 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
code,.mono{font-family:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;font-size:.86em}
a{color:var(--blue);text-underline-offset:.18em}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1:focus,.value:focus,.card:focus,main:focus{outline:none}
h1,h2,h3{margin:0;color:var(--label);text-wrap:balance;
  font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
h1{font-size:2.1rem;line-height:1.1;font-weight:800;letter-spacing:-.015em}
/* Die kurze blaue Linie des Posters unter jeder Seitenueberschrift. */
h1::after{content:"";display:block;width:3.5rem;height:2px;background:var(--blue);margin:.9rem 0 0}
h2{font-size:1.15rem;font-weight:700;margin:2.4rem 0 .8rem;padding-bottom:.35rem;border-bottom:1px solid var(--blue)}
p{margin:0 0 .8rem;max-width:70ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;z-index:10;background:var(--panel);color:var(--label);padding:.5rem .8rem;border:1px solid var(--blue)}
.skip:focus{left:.5rem;top:.5rem}
.top{position:sticky;top:0;z-index:5;background:rgba(10,11,12,.96);border-bottom:1px solid var(--rule)}
.top-in{max-width:88rem;margin:0 auto;padding:.5rem 1.25rem;display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;align-items:center;min-height:var(--top)}
.brandrow{display:flex;align-items:baseline;gap:.7rem;margin-right:auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;
  font:800 1.05rem/1 "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:-.01em;color:var(--label)}
.brand img{width:26px;height:26px;border-radius:3px;display:block}
.brand b{color:var(--blue);font-weight:800}
.brandrow small{font:400 .78rem/1 "Segoe UI",sans-serif;color:var(--note);white-space:nowrap}
.nav{display:flex;flex-wrap:wrap;gap:.1rem}
.nav a{padding:.4rem .7rem;text-decoration:none;color:var(--note);font-weight:600;border-bottom:2px solid transparent}
.nav a:hover{color:var(--label)}
.nav a[aria-current="page"]{color:var(--label);border-bottom-color:var(--blue)}
.shell{max-width:88rem;margin:0 auto;padding-inline:1.25rem;display:grid;grid-template-columns:17rem minmax(0,1fr);gap:2.2rem}
.side{position:sticky;top:var(--top);align-self:start;max-height:calc(100vh - var(--top));overflow:auto;padding-block:1.2rem 2rem;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.main{padding-block:1.8rem 5rem;min-width:0}
/* Ein Mass fuer alles im Inhalt: Karten, Tabellen, Kacheln und Linien enden in einer Flucht. */
.main > *{max-width:60rem}
.browse > summary{display:none}
.search{width:100%;padding:.5rem .65rem;border:1px solid var(--rule-strong);border-radius:2px;background:var(--panel);
  color:var(--label);font:inherit}
.search::placeholder{color:var(--note)}
.filter{font-size:.8rem;color:var(--note);margin:.4rem .45rem 0;max-width:none}
.filter button{background:none;border:0;padding:0;color:var(--blue);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:.18em}
.group{font-weight:700;font-size:.7rem;line-height:1;letter-spacing:.1em;text-transform:uppercase;color:var(--note);margin:1.2rem .45rem .4rem;padding:0;border:0}
.list ul{list-style:none;margin:0;padding:0}
.list a{display:flex;gap:.5rem;align-items:center;padding:.2rem .45rem;text-decoration:none;color:var(--value);border-left:2px solid transparent}
.list li:nth-child(even) > a:first-child{background:var(--stripe)}
.list a:hover{color:var(--label);border-left-color:var(--rule-strong)}
.list a:focus-visible{outline-offset:-2px}
.list a[aria-current="page"]{color:var(--label);border-left-color:var(--blue);font-weight:700}
.list a.hit{padding-left:1.3rem;font-size:.86rem;color:var(--note);background:none}
.list a.hit:hover{color:var(--label)}
.list .aka{color:var(--note);font-size:.78rem;font-weight:400}
.list .n{margin-left:auto;display:flex;gap:2px;align-items:center}
/* Ein Viereck je Wert, immer in derselben Reihenfolge: gemessen, aus dem Code, ohne
   Wirkung; am Ende ein rotes, wenn es zum Trait einen Spielfehler gibt. Gruen und Blau
   liegen in der Helligkeit bei 1.1:1, darum ist "aus dem Code" ein Rahmen ohne Flaeche;
   fuer Screenreader steht der Stand als Text daneben. */
.dot{width:6px;height:6px;background:var(--off);flex:none}
.dot.measured{background:var(--good)}
.dot.code{background:var(--blue)}
.dot.dead{background:var(--off)}
.dot.open{background:var(--stale)}
.dot.bug{background:var(--bad);margin-left:2px}
.dotkey{display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:.78rem;color:var(--note);margin:.5rem .45rem 0;max-width:none}
.dotkey span{display:inline-flex;align-items:center;gap:.35rem}
.eyebrow{font-weight:700;font-size:.72rem;line-height:1.4;letter-spacing:.1em;text-transform:uppercase;color:var(--note);margin:0 0 .6rem}
.lede{font-size:1.06rem;margin:1rem 0 1.5rem;color:var(--value)}
/* Kaestchen wie die Kuerzel im Spiel: Rand in der Farbe, keine Flaeche. */
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:0 .4rem;border:1px solid currentColor;
  font-weight:600;font-size:.74rem;line-height:1.55;white-space:nowrap;color:var(--note);text-decoration:none}
a.pill:hover{background:var(--raised)}
.pill.measured{color:var(--good)} .pill.code{color:var(--blue)} .pill.dead{color:var(--off)}
.pill.open,.pill.de{color:var(--stale)} .pill.bug{color:var(--bad)} .pill.live{color:var(--source)}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:.6rem;margin:0 0 1.2rem}
.count{display:block;background:var(--panel);border:1px solid var(--rule);border-top:2px solid var(--rule-strong);padding:.75rem .9rem;text-decoration:none;color:var(--value)}
a.count:hover{border-color:var(--rule-strong)}
a.count:hover b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.2em}
.count b{display:block;font:800 1.8rem/1.1 "Segoe UI Variable Display","Segoe UI",sans-serif;font-variant-numeric:tabular-nums;color:var(--label)}
.count.measured{border-top-color:var(--good)} .count.code{border-top-color:var(--blue)} .count.dead{border-top-color:var(--off)} .count.bug{border-top-color:var(--bad)}
.count.measured b{color:var(--good)} .count.code b{color:var(--blue)} .count.dead b{color:var(--off)} .count.bug b{color:var(--bad)}
.count span{font-size:.86rem}
.legend{display:grid;gap:.55rem;margin:0 0 1rem;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:8.5rem 1fr;gap:.8rem;align-items:baseline}
.legend .kind-key{font-weight:600;color:var(--label)}
@media (max-width:520px){.legend li{grid-template-columns:1fr;gap:.15rem}}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}
.chips a{padding:.2rem .7rem;border:1px solid var(--rule-strong);color:var(--value);text-decoration:none;font-weight:600;font-size:.86rem}
.chips a:hover{color:var(--label);border-color:var(--label)}
.chips a[aria-current="true"]{color:var(--ground);background:var(--blue);border-color:var(--blue)}
.tools{display:flex;justify-content:flex-end;margin:0 0 .6rem}
.tools button{background:none;border:1px solid var(--rule-strong);color:var(--value);font-weight:600;font-size:.82rem;line-height:1.5;padding:.2rem .7rem;cursor:pointer}
.tools button:hover{color:var(--label);border-color:var(--label)}
/* Ein Wert: der Rand links traegt den Stand, wie die aktive Zeile der Seitenleiste. */
.value{background:var(--panel);border:1px solid var(--rule);border-left:2px solid var(--rule-strong);margin:0 0 .8rem;scroll-margin-top:calc(var(--top) + .75rem)}
.value.measured{border-left-color:var(--good)} .value.code{border-left-color:var(--blue)} .value.dead{border-left-color:var(--off)}
.value.mark,.card.mark{border-color:var(--blue)}
.head{display:grid;grid-template-columns:var(--col) minmax(0,1fr) auto;gap:.2rem 0;align-items:baseline;align-content:start;padding:.7rem 1rem}
.fig{font:700 1.15rem/1.3 "Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--label);padding-right:1rem}
.fig.good{color:var(--good)} .fig.bad{color:var(--bad)}
.value.dead .fig{color:var(--off);text-decoration:line-through;text-decoration-thickness:1px}
.value.dead .eff{color:var(--note)}
.eff{font-size:1rem;font-weight:600;color:var(--label);margin:0;padding:0;border:0}
.marks{display:flex;gap:.35rem;align-items:center;margin-left:1rem}
.anchor{color:var(--off);text-decoration:none;font-family:Consolas,monospace;min-width:24px;min-height:24px;display:inline-grid;place-items:center}
.anchor:hover{color:var(--blue)}
.plain{grid-column:2 / -1;color:var(--value);font-size:.92rem}
.ingame{grid-column:2 / -1;color:var(--note);font-size:.9rem}
@media (max-width:520px){.head{grid-template-columns:1fr auto}.fig,.plain,.ingame{grid-column:1 / -1}}
details.proof{border-top:1px solid var(--rule)}
details.proof > summary{cursor:pointer;padding:.4rem 1rem;color:var(--note);font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;list-style-position:inside}
details.proof > summary:hover{color:var(--label)}
details.proof[open] > summary{border-bottom:1px solid var(--rule)}
details.proof .kind{margin-left:.6rem;font-weight:600;letter-spacing:.04em;text-transform:none;font-size:.78rem;color:var(--note)}
details.proof .kind.hand,details.proof .kind.play{color:var(--good)}
details.proof .kind.call{color:var(--value)}
details.proof .kind.code{color:var(--blue)}
.ev{margin:0;display:grid;grid-template-columns:var(--col) minmax(0,1fr)}
.ev dt,.ev dd{margin:0;padding:.45rem 1rem}
.ev dt{color:var(--note);font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding-top:.6rem;padding-right:0}
.ev dd{overflow-wrap:anywhere;padding-left:0}
.ev .alt{background:var(--stripe)}
@media (max-width:520px){.ev{grid-template-columns:1fr}.ev dt{padding-bottom:0}.ev dd{padding-top:.1rem;padding-left:1rem}}
.files{display:flex;flex-wrap:wrap;gap:.3rem .6rem}
.files a{font-family:"Cascadia Mono",Consolas,monospace;font-size:.8rem;white-space:nowrap;text-decoration-color:var(--rule-strong)}
.card{background:var(--panel);border:1px solid var(--rule);padding:1rem 1.1rem 0;margin:0 0 .8rem;scroll-margin-top:calc(var(--top) + .75rem)}
.card > :last-child{margin-bottom:1rem}
.card > details.proof:last-child{margin-bottom:0}
.card p{max-width:none}
.card h3{font-size:1.02rem;margin:0 0 .4rem}
.card .wo{font-weight:700;font-size:.68rem;line-height:1.4;letter-spacing:.08em;text-transform:uppercase;color:var(--note);margin:0 0 .45rem}
.card .row{display:flex;flex-wrap:wrap;gap:.4rem .5rem;align-items:center;margin:0 0 .55rem}
.card .inmod{color:var(--label)}
.card details.proof{margin:.4rem -1.1rem 0}
.card details.proof > summary,.card .ev dt{padding-left:1.1rem}
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:.7rem;margin:0 0 1rem;align-items:start}
.layers .card{margin:0}
.layers .card b.step{display:block;font:800 1.6rem/1 "Segoe UI",sans-serif;color:var(--blue);margin:0 0 .5rem}
.scroll{overflow-x:auto;border:1px solid var(--rule);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:.45rem .75rem;vertical-align:top;font-weight:400}
thead th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--note);font-weight:700;white-space:nowrap;
  border-bottom:1px solid var(--blue)}
tbody tr:nth-child(even){background:var(--stripe)}
tbody a{text-decoration:none} tbody a:hover{text-decoration:underline}
.nowrap{white-space:nowrap}
td.num,th.num{font-variant-numeric:tabular-nums;text-align:right}
td.zero{color:var(--off)}
td.quiet{color:var(--note)}
td.fig{font-size:.95em;padding-right:.75rem}
/* Was das Spiel selbst sagt: ein eigener Bereich, abgesetzt von den Zahlen der Mod. */
.game{border:1px solid var(--rule);border-left:2px solid var(--source);background:var(--raised);padding:.7rem 1rem;margin:1.4rem 0}
.game h2{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--source);margin:0 0 .4rem;padding:0;border:0}
.game ul{margin:0;padding-left:1.1rem}
.game li{margin:.1rem 0}
.game p{margin:0;max-width:none}
.report{border:1px solid var(--rule);border-left:2px solid var(--bad);padding:.7rem 1rem;margin-top:2rem;background:var(--panel)}
.report p{margin:0;max-width:none}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:1.2rem;flex-wrap:wrap}
.pager a{text-decoration:none;border:1px solid var(--rule);padding:.5rem .8rem;color:var(--value);background:var(--panel)}
.pager a:hover{border-color:var(--rule-strong);color:var(--label)}
.pager small{display:block;color:var(--note);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.empty{color:var(--note);padding:1rem .45rem}
.foot{color:var(--note);font-size:.84rem;margin-top:3rem;border-top:1px solid var(--rule);padding-top:1rem}
mark{background:none;color:var(--label);border-bottom:1px solid var(--blue)}
@media (max-width:820px){
  /* Am Telefon gehoert der Platz dem Inhalt: Kopf ohne Kleben, die Liste hinter einem Schalter. */
  :root{--top:0rem}
  .top{position:static}
  .brandrow small{display:none}
  .nav a{padding:.6rem .7rem}
  .shell{grid-template-columns:1fr;gap:0}
  .side{position:static;max-height:none;padding-bottom:.4rem;overflow:visible}
  .browse > summary{display:block;cursor:pointer;margin-top:.5rem;padding:.55rem .65rem;border:1px solid var(--rule);color:var(--value);font-weight:600}
  .list{max-height:60vh;overflow:auto;border:1px solid var(--rule);border-top:0;background:var(--panel)}
  .list a{padding:.55rem .6rem}
}
@media print{
  :root{--ground:#fff;--panel:#fff;--raised:#fff;--stripe:#f2f2f2;--label:#000;--value:#111;--note:#555;--off:#777;--rule:#bbb;
    --rule-strong:#888;--blue:#0b4f99;--good:#1d6b2a;--bad:#9a2f25;--source:#5a3d99;--stale:#8a5a00}
  .top,.side,.pager,.anchor,.tools,.skip{display:none}
  .shell{display:block}
  .value,.card{break-inside:avoid;max-width:none}
  a{color:inherit}
}
</style>
</head>

rces around 0.4 to 0.56 the floor of 20 applies, so without effect.","method":"Code values: IsoGameCharacter.processHitDamage triggered with a spawned baseball bat, the character hits itself, then getHitForce read; without and with Strong, factor with/without, tolerance 0.006.","de":false,"runs":["messung-2026-09-13-werte.txt"]},{"id":"strong/carryweight","trait":"strong","name":"Strong","cost":10,"effect":"Carry capacity","value":"×1.5","kind":"mult","tone":"","plain":"50% more","test":"new-character","proof":"play","bugs":["tragefaktor"],"ingame":"only your Strength level counts","live":false,"status":"dead","code":"IsoPlayer constructors (lines 592-600, 656-664) set maxWeightDelta; read in BodyDamage.UpdateStrength (line 1731; delta read in line 1785)","note":"Measured on 2026-09-13 on seven freshly created characters (New character test): capacity 18, with the mod's factor it would be 27; getMaxWeightDelta 1.00. The IsoPlayer constructors set the factor before applyTraits sets the chosen traits; only the Strength level counts. Listed as having no effect.","method":"New character: seven freshly created characters read ten ticks after OnNewGame with God Mode off (getMaxWeight), capacity compared against the pure Strength level and against the mod's full carry factor.","de":false,"runs":["messung-2026-09-13-figur.txt","messung-2026-09-21-figur.txt"]},{"id":"strong/grapple","trait":"strong","name":"Strong","cost":10,"effect":"Grapple effectiveness","value":"×1.25","kind":"mult","tone":"","plain":"25% more","test":"world-entry","proof":"call","bugs":["grapple-schwelle"],"ingame":"no character is ever weak enough for it to matter","live":false,"status":"dead","code":"IsoGameCharacter.calculateGrappleEffectivenessFromTraits (lines 7917-7946); callers IsoGameCharacter.pickUpCorpse (lines 7912-7913) and SwipeStatePlayer (lines 524-530); read only in BaseGrappleable.Grappled (line 75) and IsoDeadBody.Grappled (line 1775) as a threshold below 0.5","note":"No effect, checke s full carry factor.","de":false,"runs":["messung-2026-09-13-figur.txt","messung-2026-09-21-figur.txt"]},{"id":"axeman/chopspeed","trait":"axeman","name":"Ax-pert","cost":0,"effect":"Tree chopping speed","value":"+25%","kind":"pct","tone":"good","plain":"","test":"axe-ax-pert","proof":"play","bugs":[],"ingame":"one hit every second instead of every 1.25 seconds · single player only","live":false,"status":"measured","code":"IsoGameCharacter.getChopTreeSpeed (line 12388); felling animation AnimSets/player/actions/chop_tree.xml (m_SpeedScale ChopTreeSpeed, hit at 0.35), clip Bob_IdleChopDownTree 1.0 s; the game reads the speed only when the animation node starts (AnimLayer.startLiveNodeTracks, line 831)","note":"Measured on 2026-09-23: 997.6 ms between two hits with Ax-pert, 1249.9 ms without, ratio 0.7982; 983 to 1017 ms in all four phases with Ax-pert, 1248 to 1251 ms in all four without. The code predicts 1000 against 1250 ms: getChopTreeSpeed returns 1.0 instead of 0.8 with Ax-pert, the felling animation runs at that value, and the clip lasts 1.0 s. The runs of 2026-09-13 showed 1250 ms with and without Ax-pert, because the game reads the speed only when the animation node starts and the test switched the trait while the node kept running; every phase ran at the tempo of the first, which was always without Ax-pert. Until 2026-09-23 the value was therefore wrongly listed as having no effect. This holds in single player only (the check of 2026-09-23): in multiplayer, also when hosting, the server lands the hits itself (ISChopTreeAction.lua lines 64-68 only without isClient, serverStart lines 108-111 emulateAnimEvent with 1500 ms, LuaManager lines 9585-9589, AnimEventEmulator.update repeats every 1500 ms): one hit every 1.5 s, with and without Ax-pert. The x1.5 tree damage applies there too. Not checked on a server.","method":"Axe: Ax-pert: gap between two hits in milliseconds, eight phases alternating with and without Ax-pert, phase 1 with Ax-pert, the trait set before the action starts; before each further phase the test waits until PerformingAction is no longer chop_tree, plus 120 ticks; the first hit of each phase is a run-up. Axe skill fixed at 3, tree health set to 5000 before each hit. The runs of 2026-09-13 (test mod 6.18.0 to 6.21.0) restarted the action in the same tick and cannot decide the question.","de":false,"runs":["messung-2026-09-10.txt","messung-2026-09-10b.txt","messung-2026-09-10c.txt","messung-2026-09-13-sprint.txt","messung-2026-09-13-axt.txt","messung-2026-09-13b-axt.txt","messung-2026-09-13c-axt.txt","messung-2026-09-23-axt.txt"]},{"id":"axeman/axeswing","trait":"axeman","name":"Ax-pert","cost":0,"effect":"Axe swing time","value":"-20%","kind":"pct","tone":"good","plain":"","test":"axe-ax-pert","proof":"play","bugs":[],"ingame":"axes only · a little less with the Pickaxe and at high Axe skill and Fitness","live":false,"status":"measured","code":"IsoGameCharacter.calculateCombatSpeed (line 8836), CombatManager.pressedAttack (line 2660)","note":"Hit duration with/without 0.79, 0.80, 0.79 across three runs, at axe skill 3. Not a fixed factor: in calculateCombatSpeed the 0.8 without Ax-pert only hits the base term (0.8 x the weapon's BaseSpeed); after that come terms without any trait: +0.03 per weapon level, +0.02 per Fitness level and -0.07 per level of exhaustion and overload, then a random 1.1 to 1.2 and the clamp 0.8 to 1.6. Per code for the axe (BaseSpeed 1.0) that is about -17% for a new Lumberjack (Axe 2, Fitness 5; Ax-pert comes only with the Lumberjack occupation), -16% at Axe 3 and -12% at Axe 10 and Fitness 10. Slow weapons of the axe category sit at or near the lower limit 0.8 without the trait, so the model gives the trait less there: the Pickaxe (BaseSpeed 0.8) about -13% at Axe 2, -6% at Axe 0. Measured at Axe 3, though, were -20 to -21%; so hit duration does not follow 1/CombatSpeed exactly, and the test character's Fitness is not in the log. Trait Facts shows the measured -20% and gives the measured condition in the note (Firefighter Axe, Axe 3) and that per code it gets smaller with the Pickaxe and at high Axe and Fitness; until the check of 2026-09-23 the note said \"for a new character\", though only Axe 3 was measured, and gave the -12% at Axe 10 as a fact. Measurements at Axe 2, at Axe 10 with Fitness 10 and with the Pickaxe are still to come. Measured again on 2026-09-23 (test mod 6.43.1, Axe 3): swing rhythm with/without 0.8002, swing duration 0.7949.","method":"Axe: Ax-pert, three runs: 20 swings into the air, Ax-pert toggled every two swings, swing rate and duration from OnWeaponSwing and OnPlayerAttackFinished compared against the values without the trait; axe skill fixed at 3, Fitness not logged.","de":false,"runs":["messung-2026-09-13-axt.txt","messung-2026-09-13b-axt.txt","messung-2026-09-13c-axt.txt","messung-2026-09-23-axt.txt"]},{"id":"axeman/treedamage","trait":"axeman","name":"Ax-pert","cost":0,"effect":"Damage to trees","value":"+50%","kind":"pct","tone":"good","plain":"","test":"axe-ax-pert","proof":"play","bugs":[],"ingame":"axes only","live":false,"status":"measured","code":"IsoTree.WeaponHit (lines 219-222), weapon category AXE only","note":"Measured on 2026-09-13 (Axe), three runs. Damage per hit without against with Ax-pert: 35 against 53 (x1.514) at an axe tree damage of 35, and 33 against 50 (x1.515) at a tree damage of 33; per code x1.5, the tree loses whole numbers. In the first run the axe's tree damage fell from 35 to 33 after hit 10; the summary of that run (without 34.00, with 51.00, x1.5000) averages over both parts. In the second and third run the axe stayed at 33 throughout (without 33.00, with 50.00, x1.5152). The logs do not give the reason for the drop; per game code tree damage falls with the sharpness of the axe (HandWeapon.getTreeDamage).","method":"Axe: Ax-pert, three runs: tree felled via vanilla's doChopTree, axe skill fixed at 3, tree health reset to 5000 before each hit, damage per hit taken as the difference; Ax-pert toggled every two hits in the first run, then 8 phases each with its own action.","de":false,"runs":["messung-2026-09-13-axt.txt","messung-2026-09-13b-axt.txt","messung-2026-09-13c-axt.txt"]},{"id":"underweight/meleedamage","trait":"underweight","name":"Low Weight","cost":0,"effect":"Melee damage","value":"-20%","kind":"pct","tone":"bad","plain":"","test":"world-entry","proof":"call","bugs":[],"ingame":"weapon swings only · stomping a downed zombie does full damage","live":true,"status":"measured","code":"CharacterTraits.getTraitDamageDealtReductionModifier (line 132); consumed in CombatManager (lines 819-821), melee only, not when stomping (lines 846-850)","note":"Getter with trait on and off, matched to the decimal place as in the code. Stomping a downed zombie then overwrites the damage with its own formula (lines 846-850), and the trait drops out there; a standing shove does no damage anyway (lines 593-595). Panic and stress subtract 0.1 per level after the factor. The note says so since the check of 2026-09-23.","method":"World entry: getTraitDamageDealtReductionModifier() read without and with Low Weight, value compared to the decimal place as in the code, traits saved beforehand and reset afterward.","de":false,"runs":["messung-2026-09-10.txt","messung-2026-09-10b.txt","messung-2026-09-10c.txt","messung-2026-09-13-sprint.txt"]},{"id":"veryunderweight/meleedamage","trait":"veryunderweight","name":"Very Low Weight","cost":0,"effect":"Melee damage","value":"-40%","kind":"pct","tone":"bad","plain":"","test":"world-entry","proof":"call","bugs":[],"ingame":"weapon swings only · stomping a downed zombie does full damage","live":true,"status":"measured","code":"CharacterTraits.getTraitDamageDealtReductionModifier (line 132); consumed in CombatManager (lines 819-821), melee only, not when stomping (lines 846-850)","note":"Getter with trait on and off, matched to the decimal place as in the code. Stomping a downed zombie then overwrites the damage with its own formula (lines 846-850), and the trait drops out there; a standing shove does no damage anyway (lines 593-595). Panic and stress subtract 0.1 per level after the factor. The note says so since the check of 2026-09-23.","method":"World entry: getTraitDamageDealtReductionModifier() read without and with Very Low Weight, value compared to the decimal place as in the code, traits saved beforehand and reset afterward.","de":false,"runs":["messung-2026-09-10.txt","messung-2026-09-10b.txt","messung-2026-09-10c.txt","messung-2026-09-13-sprint.txt"]},{"id":"veryunderweight/grapple","trait":"veryunderweight","name":"Very Low Weight","cost":0,"effect":"Grapple effectiveness","value":"×0.8","kind":"mult","tone":"","plain":"20% less","test":"world-entry","proof":"call","bugs":["grapple-schwelle"],"ingame":"no character is ever weak enough for it to matter","live":false,"status":"dead","code":"IsoGameCharacter.calculateGrappleEffectivenessFromTraits (lines 7917-7946); callers IsoGameCharacter.pickUpCorpse (lines 7912-7913) and SwipeStatePlayer (lines 524-530); read only in BaseGrappleable.Grappled (line 75) and IsoDeadBody.Grappled (line 1775) as a threshold below 0.5","note":"No effect, checked again on 2026-09-23: the game only checks the value against a minimum of 0.5; below it a grab or a corpse pickup is refused. Nothing reads the value after that, neither for grabbing nor for dragging. No trait combination gets that low: the game always keeps exactly one weight trait, and the lowest value is 0.54 (Emaciated with Cowardly). What was measured is only what the function returns: getter with the trait on and off, matching the code to the decimal place (see the game bug on the grapple threshold).","method":"World entry: calculateGrappleEffectivenessFromTraits() read once without, once with Very Low Weight, value compared to the decimal place as in the code, traits saved beforehand and reset afterward.","de":false,"runs":["messung-2026-09-10.txt","messung-2026-09-10b.txt","messung-2026-09-10c.txt","messung-2026-09-13-sprint.txt"]},{"id":"veryunderweight/trip","trait":"veryunderweight","name":"Very Low Weight","cost":0,"effect":"Chance of tripping on a fence","value":"+30 of 100","kind":"flat","tone":"bad","plain":"","test":"code-values","proof":"call","bugs":["zaun-veryunderweight"],"ingame":"only when you jump a fence while running or sprinting · fit characters trip less, out of breath or heavily loaded ones more; the game counts it twice · at Fitness 5: 25% instead of 0% running, 35% instead of 5% sprinting · game bug","live":false,"status":"measured","code":"ClimbOverFenceState.shouldFallAfterVaultOver (line 493; traits lines 511-528; roll against the counter minus Fitness line 529)","note":"Measured on 2026-09-14 (code values): tripped without 9.9333%, with 39.6333%, difference 29.7000 points, 3000 samples per case over 70 ticks. According to the code +30, because Very Low Weight (VERY_UNDERWEIGHT in the game code) is checked twice (+20 and +10, see the game bug on the Very Low Weight double check when climbing fences). The roll is Rand.Next(100) < counter - Fitness (line 529): a negative counter acts as 0. The measurement ran sprinting at Fitness 0, where the full value applies; at a run the base is below 0 from Fitness 1 on and absorbs part of the points. Very Low Weight comes only from losing weight in play (Nutrition.applyTraitFromWeight above 50 up to 65 kg; IsProfessionTrait = true, cost 0, not selectable at character creation, and Fast Metabolism grants only Low Weight); the Fitness -2 from XPBoosts applies only in applyTraits at creation. Per code at Fitness 5: 25% at a run, 35% sprinting; counted once (+20) it would be 15% and 25%, without the trait 0% and 5%. The note gives this since the check of 2026-09-23; before, it assumed a new character with Fitness 3, which cannot exist.","method":"Code values: ClimbOverFenceState.enter triggered with VaultOverSprint on the standing character, Fitness 0; \"fall\" outcome counted, h Sprinting 1 from 0.7000 to 0.9000 (x1.2857). In the second run one phase with the trait had a mean of 0.9445, which gives x1.3532 there. At level 3 the bonus is smaller (+0.20 instead of +0.25). With higher Sprinting the share shrinks; from Sprinting 7 the run speed without the trait is already capped at 1.0 per code (not measured). Fifth run on 2026-09-21 on a fresh character (Sprinting 0): level 4 x1.1698; at level 3 x1.1280, where Sprinting again rose during the first phase, the second pair of phases alone gives x1.133. Across all clean runs running spans x1.1213 to x1.1698. Trait Facts therefore shows the range 12 to 17%; before the re-measurement of 2026-09-21 it was 13 to 16%.","method":"Adrenaline (second to fourth run of the series and one re-measurement; the first run measured walking only): the character runs straight ahead with Shift held, the test mod holds panic at level 4 in every tick, in separate parts at level 3, and keeps endurance full, God Mode off; per part five phases of 300 ticks alternating without and with Adrenaline Junkie, nine in the re-measurement; per phase distance divided by the Multiplier, each phase with the trait against the mean of its neighbours without. Alongside, the animation variable WalkSpeed as the game's own value.","de":false,"runs":["messung-2026-09-20b-adrenalin.txt","messung-2026-09-20c-adrenalin.txt","messung-2026-09-20d-adrenalin.txt","messung-2026-09-20-adrenalin-strong.txt","messung-2026-09-21-adrenalin.txt"]},{"id":"adrenalinejunkie/panicsprint","trait":"adrenalinejunkie","name":"Adrenaline Junkie","cost":4,"effect":"Sprinting speed when Frightened or Terrified","value":"+10 to +15%","kind":"pctrange","tone":"good","plain":"","test":"adrenaline-speed-under-panic","proof":"play","bugs":[],"ingame":"most when Terrified · less with higher Running","live":false,"status":"measured","code":"IsoGameCharacter.calculateWalkSpeed (lines 8957-9006): run speed = (base speed - 0.15) x fullSpeedMod + Sprinting / 20 (lines 896 ple-schwelle"],"ingame":"no character is ever weak enough for it to matter","live":false,"status":"dead","code":"IsoGameCharacter.calculateGrappleEffectivenessFromTraits (lines 7917-7946); callers IsoGameCharacter.pickUpCorpse (lines 7912-7913) and SwipeStatePlayer (lines 524-530); read only in BaseGrappleable.Grappled (line 75) and IsoDeadBody.Grappled (line 1775) as a threshold below 0.5","note":"No effect, checked again on 2026-09-23: the game only checks the value against a minimum of 0.5; below it a grab or a corpse pickup is refused. Nothing reads the value after that, neither for grabbing nor for dragging. No trait combination gets that low: the game always keeps exactly one weight trait, and the lowest value is 0.54 (Emaciated with Cowardly). What was measured is only what the function returns: getter with the trait on and off, matching the code to the decimal place (see the game bug on the grapple threshold).","method":"World entry: calculateGrappleEffectivenessFromTraits() read once without, once with Speed Demon, value compared to the decimal place as in the code, traits saved beforehand and reset afterward.","de":false,"runs":["messung-2026-09-10.txt","messung-2026-09-10b.txt","messung-2026-09-10c.txt","messung-2026-09-13-sprint.txt"]},{"id":"speeddemon/topspeed","trait":"speeddemon","name":"Speed Demon","cost":1,"effect":"Vehicle top speed","value":"+11%","kind":"pct","tone":"good","plain":"","test":"cars","proof":"play","bugs":[],"ingame":"fast cars gain little or nothing · about half in multiplayer · at most 122 km/h","live":false,"status":"measured","code":"CarController.control_ForwardNew (lines 669-673): above maxSpeed x 1.15 engine force drops with (maxSpeed x 1.15 + 20 - speed) / 20, without the trait above maxSpeed with (maxSpeed + 20 - speed) / 20. Cap 34.0 m/s in BaseVehicle.","note":"Measured on 2026-09-10 in the plateau test, factor with/without: SmallCar 1.1162, StepVan 1.1133, CarNormal 1.1120, PickUpVan 1.1115 and 1.1102. The third PickUpVan pair is excluded: in that phase the car reached only 40.341 km/h instead of 88.918, so the plateau was not reached. The log does not give the cause. With that pair the log reports 0.9084. Confirmed on 2026-09-11 from standstill: PickUpVan 79.925 to 88.893 km/h, factor 1.1122. CarNormal sits at the cap of 122.400 km/h with the trait, so its factor is limited by the cap. SportsCar already drives 122.400 km/h without the trait, factor 1.0000. Why about +11% and not +15%: the 1.15 only moves the point where engine force starts to drop. Force is zero at maxSpeed x 1.15 + 20 km/h, without the trait at maxSpeed + 20 km/h. On the PickUpVan (maxSpeed 60.0) that is 89.0 against 80.0 km/h. In multiplayer, also when hosting, the client computes with an inflated speed (CarController lines 130-136, a factor up to 120 / speed limit) and cuts engine force at the real speed limit (lines 681-683, default 70). By the plateau rule ordinary cars gain about 5 to 7% there and fast ones nothing; computed only, not measured in multiplayer. The note says so since the check of 2026-09-23; before, it said \"servers cap at 70 km/h by default\", which is the real speed, while the gauge shows 120 there.","method":"Cars (plateau test): full throttle on a straight stretch, Speed Demon alternating on and off, each phase first settled, then the speed plateau measured, three pairs per car. Five cars: SmallCar, PickUpVan, StepVan, CarNormal and SportsCar. Four show the factor, SportsCar shows only the cap. In addition Cars (acceleration test) on 2026-09-11: PickUpVan from standstill at full throttle until the speed settled, one pair.","de":false,"runs":["messung-2026-09-10h-auto.txt","messung-2026-09-10i-auto.txt","messung-2026-09-10j-auto.txt","messung-2026-09-10k-auto.txt","messung-2026-09-11f-pickupvan.txt"]},{"id":"speeddemon/rpmbuild","trait":"speeddemon","name":"Speed Demon","cost":1,"effect":"How fast the engine revs up in reverse","value":"×3","kind":"mult","tone":"good","plain":"3 times as much","test":"cars","proof":"play","bugs":["speeddemon-vorwaerts"],"ingame":"reverse only · about 8 to 18% more pull","live":false,"status":"measured","code":"CarController.control_Reverse (lines 694-698); control_Forward with the term has no caller","note":"RPM reverse x2.5 to x3.4, forward 1.02. Pull (getForce) in reverse x1.076, x1.101 and x1.124 (SportsCar, run-up to 2, 4 and 6 km/h) and x1.112 to x1.181 (PickUpVan, up to 20 km/h); hence the note 7.6 to 18%. In the first reverse run on the StepVan the character needed 23 and 22 instead of 25 to 26 ticks from 2 to 8 km/h with Speed Demon (x0.90).","method":"Cars (acceleration test) with the SportsCar (reverse up to 8 km/h) and the PickUpVan (until the speed settles): RPM (getEngineSpeed) and force (getForce) per speed window when starting from standstill, Speed Demon against the phase without the trait, forward and reverse separately. Also the plateau test with the reverse time on the StepVan.","de":false,"runs":["messung-2026-09-11c-rueckwaerts.txt","messung-2026-09-11e-beschleunigung.txt","messung-2026-09-11f-pickupvan.txt"]},{"id":"speeddemon/reversenoise","trait":"speeddemon","name":"Speed Demon","cost":1,"effect":"How far zombies hear you reversing","value":"×3","kind":"mult","tone":"bad","plain":"3 times as much","test":"","proof":"code","bugs":[],"ingame":"the loud engine bursts only, the steady low hum grows less","live":false,"status":"code","code":"VehicleEngine.updateWorldSounds (line 257)","note":"The RPM is measured, the volume is only calculated from it. Not measured: the test mod can read the noise radius only in the game's debug mode, and three of the four engine sounds are random. The game derives the radius from volume and RPM alone, so the result would again be the RPM already measured.","method":"","de":false,"runs":["messung-2026-09-11f-pickupvan.txt"]},{"id":"sundaydriver/engineforce","trait":"sundaydriver","name":"Sunday Driver","cost":-1,"effect":"Engine power","value":"-25%","kind":"pct" at maxSpeed x 0.75 + 20 km/h, without the trait at maxSpeed + 20 km/h. On the PickUpVan (maxSpeed 60.0) that is 65.0 against 80.0 km/h. Only this one car was measured from standstill, one pair. In multiplayer, also when hosting, the inflated speed and the server speed limit (CarController lines 130-136, 681-683) shift this value too: by the plateau rule about -12% on ordinary cars and about -4% on sports cars; computed only, not measured in multiplayer. The note says so since the check of 2026-09-23.","method":"Cars (acceleration test): PickUpVan driven from standstill at full throttle until the speed settled, top speed with Sunday Driver against the phase without the trait before it. The earlier plateau test set the trait at full speed and therefore saw no reduction.","de":false,"runs":["messung-2026-09-11f-pickupvan.txt"]},{"id":"sundaydriver/reverseforce","trait":"sundaydriver","name":"Sunday Driver","cost":-1,"effect":"Engine power in reverse","value":"-30%","kind":"pct","tone":"bad","plain":"","test":"cars","proof":"play","bugs":[],"ingame":"up to about 3 km/h · above that it keeps dropping, to nothing at 10 km/h","live":false,"status":"measured","code":"CarController.control_Reverse (line 686; Sunday Driver line 690, factor lines 703-707), engineForce x0.7; called from update (line 233)","note":"Measured on 2026-09-11, evaluated on 2026-09-13: in the 2 to 4 km/h window 0.7000 (SportsCar) and 0.7004 (PickUpVan). Above that, the reduction applies up to 10 km/h. The note gives the limit since the check of 2026-09-23: -30% up to about 3.3 km/h, above that the factor falls in a straight line to 0 at 10 km/h (x0.63 at 4, x0.42 at 6, x0.21 at 8 km/h; CarController lines 692 and 703-708).","method":"Cars (acceleration test) with the SportsCar and the PickUpVan: force (getForce) in reverse in the 2 to 4 km/h window with Sunday Driver read against the phase without the trait; above that, the trait already reduces force with speed.","de":false,"runs":["messung-2026-09-11 nds the radius zombies hear up to whole tiles (ceil(volume x 10), line 5329); the test chose a volume with a radius of exactly 10. With shoes in play, per code: walking 7 to 5, running 11 to 7, sprinting 14 to 9 tiles. The sound the player hears stays the same: FMOD gets the volume before the trait factors (parameterVolume, lines 5306 and 5325). So since the check of 2026-09-23 the row says \"Footstep noise radius for zombies\" instead of \"Footstep loudness\", and the note gives the whole squares (walking 7 to 5, running 11 to 7, sprinting 14 to 9 squares). Sneaking 4 to 3 (getSneakSpotMod 0.95 x 1.2 at Sneak 0). The numbers hold outdoors; indoors the game halves the radius and truncates it (lines 5332-5334): sneaking 2 to 1, walking 3 to 2, running 5 to 3, sprinting 7 to 4. The note gives both since the check of 2026-09-23.","method":"Code values, game with -debug: DoFootstepSound on the character, WorldSound.radius of the new sound read via reflection; invisible off, Lightfoot and Nimble 0, not sneaking, without and with Graceful; factor with/without, tolerance 0.006.","de":false,"runs":["messung-2026-09-14-werte.txt"]},{"id":"graceful/trip","trait":"graceful","name":"Graceful","cost":4,"effect":"Chance of tripping on a fence","value":"-10 of 100","kind":"flat","tone":"good","plain":"","test":"code-values","proof":"call","bugs":[],"ingame":"only when you jump a fence while running or sprinting · fit characters trip less, out of breath or heavily loaded ones more; new character: no change running, 0% instead of 5% sprinting","live":false,"status":"measured","code":"ClimbOverFenceState.shouldFallAfterVaultOver (line 493; traits lines 511-528; roll against the counter minus Fitness line 529)","note":"Measured on 2026-09-14 (code values): tripped without 9.9333%, with 0.0000%, difference -9.9333 points (per code -10, at Fitness 0 the chance therefore drops to 0), per case 3000 samples over 50 ticks. The roll is Rand.Next(100) < counter - Fitness (line 529): a negative counter acts as 0. The measurement ran sprinting at Fitness 0, where the full value applies; at a run the base is below 0 from Fitness 1 on and absorbs part of the points. The weight traits also lower starting Fitness. Per code new character (Fitness 5): 0% at a run with and without the trait, sprinting 5% to 0%; the note gives it since the check of 2026-09-23.","method":"Code values: ClimbOverFenceState.enter triggered with VaultOverSprint on the standing character, Fitness 0; outcome \"fall\" counted, without and with Graceful, 3000 samples each over several ticks alternating, difference in shares with minus without, tolerance 4 points.","de":false,"runs":["messung-2026-09-14-werte.txt"]},{"id":"graceful/lungefall","trait":"graceful","name":"Graceful","cost":4,"effect":"Chance of falling when a zombie lunges","value":"-10 of 100","kind":"flat","tone":"good","plain":"","test":"","proof":"code","bugs":[],"ingame":"at fences and windows · new character 20%, less with Fitness and Nimble · not in Rising or with Zombie Lunge off","live":false,"status":"code","code":"IsoGameCharacter.attackFromWindowsLunge (line 12875; traits lines 12900-12915; stagger and roll lines 12919-12924); triggered only by the climbing zombie: ClimbOverFenceState (lines 367-371), ClimbThroughWindowState (lines 290-294), GrappledThrownOutWindowState (lines 267-271)","note":"Not measured: the roll only happens when a zombie that is climbing over a fence or through a window (or is being thrown out of one) lunges at a character close by (under 3.9 tiles, same floor) and its hand hits; only with the sandbox option Zombie Lunge (on by default, off in the Rising preset). Every hit makes the character stagger; the roll decides whether it also falls. After a hit the game blocks the next one for about 7 seconds, so a reliable share would need hundreds of hits per case.","method":"","de":false,"runs":[]},{"id":"clumsy/footsteps","trait":"clumsy","name":"Clumsy","cost":-2,"effect":"How far zombies hear yo ead of 5% sprinting","live":false,"status":"measured","code":"ClimbOverFenceState.shouldFallAfterVaultOver (line 493; traits lines 511-528; roll against the counter minus Fitness line 529)","note":"Measured on 2026-09-14 (code values): tripped without 9.9333%, with 19.0333%, difference 9.1000 points (per code +10), per case 3000 samples over 50 ticks. The roll is Rand.Next(100) < counter - Fitness (line 529): a negative counter acts as 0. The measurement ran sprinting at Fitness 0, where the full value applies; at a run the base is below 0 from Fitness 1 on and absorbs part of the points. The weight traits also lower starting Fitness. Per code new character (Fitness 5): 0% to 5% at a run, 5% to 15% sprinting; the note gives it since the check of 2026-09-23.","method":"Code values: ClimbOverFenceState.enter triggered with VaultOverSprint on the standing character, Fitness 0; outcome \"fall\" counted, without and with Clumsy, 3000 samples each over several ticks alternating, difference in shares with minus without, tolerance 4 points.","de":false,"runs":["messung-2026-09-14-werte.txt"]},{"id":"clumsy/lungefall","trait":"clumsy","name":"Clumsy","cost":-2,"effect":"Chance of falling when a zombie lunges","value":"+10 of 100","kind":"flat","tone":"bad","plain":"","test":"","proof":"code","bugs":[],"ingame":"at fences and windows · new character 20%, less with Fitness and Nimble · not in Rising or with Zombie Lunge off","live":false,"status":"code","code":"IsoGameCharacter.attackFromWindowsLunge (line 12875; traits lines 12900-12915; stagger and roll lines 12919-12924); triggered only by the climbing zombie: ClimbOverFenceState (lines 367-371), ClimbThroughWindowState (lines 290-294), GrappledThrownOutWindowState (lines 267-271)","note":"Not measured: the roll only happens when a zombie that is climbing over a fence or through a window (or is being thrown out of one) lunges at a character close by (under 3.9 tiles, same floor) and its hand hits; only with the sandbox option Zombie Lunge (on by default, off in the Rising preset). Every hit makes the character stagger; the roll decides whether it also falls. After a hit the game blocks the next one for about 7 seconds, so a reliable share would need hundreds of hits per case.","method":"","de":false,"runs":[]},{"id":"clumsy/climb","trait":"clumsy","name":"Clumsy","cost":-2,"effect":"Climbing safety on tall fences","value":"-50%","kind":"pct","tone":"bad","plain":"","test":"climbing","proof":"call","bugs":[],"ingame":"a new character fails 1 in 3 times instead of 1 in 4 · not in Rising or with Easy Climbing","live":false,"status":"measured","code":"IsoGameCharacter.getClimbingFailChanceFloat (line 14718; traits lines 14727-14748); used in ClimbSheetRopeState (line 263, roll line 84), ClimbDownSheetRopeState (line 130) and on tall fences in ClimbOverWallState (line 296)","note":"651 data points across 21 cases, none deviates from the formula. The game rolls with the integer square root of the score (line 14753): for a new character 20 gives 4, with Clumsy 10 gives 3; the chance to fail on tall fences therefore rises from 25% to 33%, not to double. With the sandbox option Easy Climbing (on in the Rising preset) every climb succeeds without a roll, the sheet-rope fall roll is skipped, and pathfinding always routes over tall fences (ClimbOverWallState lines 292-294, ClimbSheetRopeState line 93, ClimbDownSheetRopeState line 83, PathFindRequest line 77); the note says so since the check of 2026-09-23.","method":"Climbing: getClimbingFailChanceFloat read in 21 trait cases, including Clumsy; for each case Fitness, Strength and Nimble individually from 0 to 10, the others at 0. The test notes deviations against the case without trait; the formula was checked afterwards.","de":false,"runs":["messung-2026-09-13-klettern.txt"]},{"id":"clumsy/canwound","trait":"clumsy","name":"Clumsy","cost":-2,"effect":"Chance of cutting yourself opening a can","value":"20 → 30","kind":"fromto","tone":"bad","plain ISVehicleMenu.lua (line 116): hotwiring without Electrical 1 and Mechanics 2","note":"Measured on 2026-09-20 (In the car): hotwiring locked without skills, offered with Burglar; without Burglar offered only from Electricity 1 and Mechanics 2 (five cases).","method":"In the car: at the wheel of a car without a key, ISVehicleMenu.showRadialMenu called with a stand-in menu that collects the texts from addSlice; five cases of Burglar, Electricity and Mechanics.","de":false,"runs":["messung-2026-09-20-imauto.txt"]},{"id":"burglar/climb","trait":"burglar","name":"Burglar","cost":0,"effect":"Climbing safety on tall fences","value":"+4 points","kind":"flat","tone":"good","plain":"","test":"climbing","proof":"call","bugs":[],"ingame":"new character 20 · the chance only changes at steps like 16, 25 and 36 · not in Rising or with Easy Climbing; a new Burglar without gloves fails 1 in 5 times instead of 1 in 4 · with ordinary gloves no change","live":false,"status":"measured","code":"IsoGameCharacter.getClimbingFailChanceFloat (line 14718; traits lines 14727-14748); used in ClimbSheetRopeState (line 263, roll line 84), ClimbDownSheetRopeState (line 130) and on tall fences in ClimbOverWallState (line 296)","note":"651 data points across 21 cases, none deviates from the formula. Burglar comes only with the Burglar occupation, which also gives Nimble 2 (character_professions.txt lines 3-11): without gloves 24 without the trait, 28 with it (root 4 -> 5, tall fences 25% -> 20%); with ordinary gloves (+4) 28 -> 32, both root 5. Until the check of 2026-09-23 the note assumed a character without Nimble and said the trait alone changes nothing; since then Burglar has its own hint. With the sandbox option Easy Climbing (on in the Rising preset) every climb succeeds without a roll, the sheet-rope fall roll is skipped, and pathfinding always routes over tall fences (ClimbOverWallState lines 292-294, ClimbSheetRopeState line 93, ClimbDownSheetRopeState line 83, PathFindRequest line 77); the
