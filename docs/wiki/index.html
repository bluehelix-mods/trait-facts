 level at which the recipe is learned automatically, without 4.0000, with 3.0000, difference -1.0000; the occupation version likewise (without 4.0000, with 3.0000, difference -1.0000). After the -1 the game applies max(1, level) (lines 910-913, 926-929): a requirement at level 1 stays 1, for example the second skill of Forge_Small_Knife (Blacksmith:2;SmallBlade:1); that is 19 of about 375 requirements in media/scripts. The measurement used a recipe from level 2 and so could not see the floor. The note says so since the check of 2026-09-23.","method":"Code values: CraftRecipe.checkAutoLearnAnySkills on the character for a recipe with exactly one learn skill from level 2, level set upward from 0, without and with Inventive (both versions); difference of the smallest learn level with minus without, recipe forgotten afterwards.","de":false,"runs":["messung-2026-09-14-werte.txt"]},{"id":"inventive/research","trait":"inventive","name":"Inventive","cost":2,"effect":"Skill level to research a recipe","value":"-2 lvl","kind":"flat","tone":"good","plain":"","test":"code-values","proof":"call","bugs":[],"ingame":"a recipe that needs level 1 drops only to 0 · never below 0","live":false,"status":"measured","code":"IsoGameCharacter.isInventive (line 15232); CraftRecipe.getResearchSkillLevel (line 1215, -2 in lines 1232-1233) ; normalizeSkillLevel (lines 1238-1242), canResearch (lines 1304-1307)","note":"Measured on 2026-09-13 (code values): research level of MakeImprovisedLighter 4 without, 2 with Inventive, likewise with the occupation version (CraftRecipe.getResearchSkillLevel). The -2 has a floor: normalizeSkillLevel clamps to 0 through 10 (lines 1238-1242), and below 1 every recipe can be researched (canResearch, lines 1304-1307). Without its own ResearchSkillLevel a recipe's research level is max(1, rounded highest requirement x 2/3) (lines 1215-1225); about a quarter of the researchable recipes sit at 1 (for example Forge_Small_Knife) and drop only to 0. The note says so since the check of 2026-09-23.","method":"Code values: CraftRecipe.getResearchSkillLevel on the recipe MakeImprovisedLighter (level 4) read on the character, without and with Inventive, difference with minus without; the game clamps the result to 0 through 10, which does not apply at level 4.","de":false,"runs":["messung-2026-09-13b-werte.txt"]},{"id":"fastreader/readtime","trait":"fastreader","name":"Fast Reader","cost":2,"effect":"Reading time","value":"×0.7","kind":"mult","tone":"good","plain":"30% less","test":"code-values","proof":"call","bugs":[],"ingame":"you read about 43% faster","live":false,"status":"measured","code":"shared/TimedActions/ISReadABook.lua (lines 443-509)","note":"Measured on 2026-09-13 (code values): without 79200.0000, with 55440.0000, factor 0.7000.","method":"Code values: ISReadABook:new built on the character with a book, maxTime read; without and with Fast Reader, factor with/without, tolerance 0.006.","de":false,"runs":["messung-2026-09-13-werte.txt"]},{"id":"slowreader/readtime","trait":"slowreader","name":"Slow Reader","cost":-2,"effect":"Reading time","value":"×1.3","kind":"mult","tone":"bad","plain":"30% more","test":"code-values","proof":"call","bugs":[],"ingame":"you read about 23% slower","live":false,"status":"measured","code":"shared/TimedActions/ISReadABook.lua (lines 443-509)","note":"Measured on 2026-09-13 (code values): without 79200.0000, with 102960.0000, factor 1.3000.","method":"Code values: ISReadABook:new built on the character with a book, maxTime read; without and with Slow Reader, factor with/without, tolerance 0.006.","de":false,"runs":["messung-2026-09-13-werte.txt"]}],"bugs":[{"id":"zaun-veryunderweight","title":"Tripping over a fence: Very Low Weight counts twice, Low Weight not at all","consequence":"When tripping over a fence, Very Low Weight gets +30 instead of +20, and Low Weight gets nothing at all. This was probably meant to be Low Weight (UNDERWEIGHT in the game code) once. Measured on 2026-09-14 (Code values) at Fitness 0: without trait, tripped 9.9333%; with Very Low Weight, 39.6333% (difference 29.7000 points, +30 per code); with Low Weight, 9.1667% (difference -0.7667 points, 0 per code); 3000 samples over 70 ticks per case.","code":"ClimbOverFenceState.shouldFallAfterVaultOver (line 493; VERY_UNDERWEIGHT in lines 517 and 520); no separate UNDERWEIGHT in the constant pool","method":"Code values: ClimbOverFenceState.enter triggered on the character with VaultOverSprint, Fitness 0, \"fall\" outcome counted, without trait and with Very Low Weight and Low Weight, 3000 samples each, alternating over several ticks; difference of shares with minus without, tolerance 4 points.","de":false,"status":"measured","handling":"Trait Facts says so in a note at the value.","proof":"call","values":["veryunderweight/trip"],"test":"code-values","traits":[{"key":"veryunderweight","name":"Very Low Weight"},{"key":"underweight","name":"Low Weight"}],"runs":["messung-2026-09-14-werte.txt"]},{"id":"lunge-veryunderweight","title":"Falling from a zombie lunge: Very Low Weight counts twice","consequence":"When a zombie lunges at you while it climbs over a fence or through a window and hits, Very Low Weight again gets +30 instead of +20 on the chance to fall.","code":"IsoGameCharacter.attackFromWindowsLunge (line 12875; VERY_UNDERWEIGHT in lines 12906 and 12909)","method":"","de":false,"status":"code","handling":"Trait Facts says so in a note at the value.","proof":"code","values":["veryunderweight/lungefall"],"test":"","traits":[{"key":"veryunderweight","name":"Very Low Weight"},{"key":"underweight","name":"Low Weight"}],"runs":[]},{"id":"metallbarrikade","title":"The old barricade action times metal like planks, but nothing in normal play reaches it","consequence":"ISBarricadeAction:new calls getDuration before it sets isMetal. Metal would get 100 - 5 x Carpentry there (Handy -20) instead of 170 - 5 x MetalWelding (an MP server recomputes the duration through NetTimedAction.getDuration after new(), so it would be right there). Measured on 2026-09-13 (code values) on the action itself: metal without the trait 100, with Handy 80. Checked again on 2026-09-21 in the game code of 42.20.4: only the game's own test file still calls this action (client/Tests/TimedActionsTests.lua). Players barricade through the build menu (ISWorldObjectContextMenu.onBarricade, ISBuildIsoEntity). There planks and metal sheet have the same time of 200 (entity_barricade_planks.txt and entity_barricade_metalsheet.txt), and Handy takes 50 off as with every construction (ISBuildAction:new). So both taking equally long is by design in play and not a bug; the bug sits in code no player reaches. Until 2026-09-21 this entry was listed here as a bug in play. That was wrong. Reproduced in play on 2026-09-21 through the build menu: planks and metal sheet are both timed at 200, with Handy both at 150 (Carpentry 1, MetalWelding 3). The status stays code: the direct call confirms the arithmetic, but nothing in play reaches this code.","code":"shared/TimedActions/ISBarricadeAction.lua (lines 191-194)","method":"Code values: ISBarricadeAction:new(character, nil, true, false).maxTime read, Carpentry (Woodwork) and MetalWelding set to 0 beforehand, without and with Handy; factor with/without checked against the value per code with the bug (metal like planks), tolerance 0.006.","de":false,"status":"code","handling":"Trait Facts shows the value greyed out, with the reason.","proof":"hand","values":["handy/barricade"],"test":"code-values","traits":[{"key":"handy","name":"Handy"}],"runs":["messung-2026-09-13d-werte.txt","messung-2026-09-21-nachstellen.txt"]},{"id":"leichenstress-craft","title":"The old crafting action compares an object with a text, but nothing in normal play reaches it","consequence":"In ISCraftAction:update the condition checks getContainer():getType() == \"inventoryfemale\" or getContainer() == \"inventorymale\". The second comparison pits an object against a text and is never true: stress and unhappiness would only occur there for female corpses. Measured on 2026-09-13 (code values) on the action itself: female, unhappiness 0.008 per update, Brave x0.5, Cowardly x2, Desensitized 0; male 0. Checked again on 2026-09-21 in the game code of 42.20.4: ISCraftAction is only created in ISInventoryPaneContextMenu.OnCraft, which needs an old-style recipe. media/scripts does not hold a single one any more, only craftRecipe; crafting runs through OnNewCraft and the handcraft window. So crafting causes no corpse stress at all, for male or female corpses. Outside crafting, only taking items out of a corpse (ISInventoryTransferAction) matters, and it adds unhappiness only, no stress; that is measured and holds. Until 2026-09-21 this entry was listed here as a bug in play. That was wrong.","code":"shared/TimedActions/ISCraftAction.lua (lines 19-26, comparison in line 20)","method":"Code values: ISCraftAction:update triggered on a stand-in action, the hammer lies in a real container (ItemContainer.new) of type inventoryfemale or inventorymale, not a corpse; unhappiness without and with Brave, Cowardly, Desensitized.","de":false,"status":"code","handling":"Trait Facts leaves this factor out, because it never applies.","proof":"code","values":["desensitized/corpses"],"test":"code-values","traits":[{"key":"brave","name":"Brave"},{"key":"cowardly","name":"Cowardly"},{"key":"desensitized","name":"Desensitized"}],"runs":["messung-2026-09-13d-werte.txt"]},{"id":"tragefaktor","title":"The carry factor of Strong, Stout, Puny and Weak never applies","consequence":"The IsoPlayer constructors set maxWeightDelta before applyTraits sets the chosen traits. Carry capacity follows only the Strength level; the only exception is Last Stand. Measured on 2026-09-13 on seven new characters: Strong 18 instead of 27, Stout 15 instead of 18, Puny 6 instead of 4, Weak 9 instead of 8. Strong, Stout, Puny and Weak checked again on 2026-09-21: again 18, 15, 6 and 9. Trait Facts has listed the four values greyed out with an explanation.","code":"IsoPlayer (lines 592-600, 656-664), IsoWorld (lines 2200, 2211); setMaxWeightDelta has no caller","method":"New character: seven freshly created characters read ten ticks after OnNewGame with God Mode off (getMaxWeight), capacity compared against the pure Strength level and against the mod's full carry factor.","de":false,"status":"measured","handling":"Trait Facts shows the value greyed out, with the reason.","proof":"play","values":["strong/carryweight","stout/carryweight","weak/carryweight","feeble/carryweight"],"test":"new-character","traits":[{"key":"strong","name":"Strong"},{"key":"stout","name":"Stout"},{"key":"weak","name":"Puny"},{"key":"feeble","name":"Weak"}],"runs":["messung-2026-09-13-figur.txt","messung-2026-09-21-figur.txt"]},{"id":"stufentraits-erschaffung","title":"The game swaps Fitness and Strength traits while it creates the character","consequence":"applyTraits calls LevelPerk per level, XpUpdate.levelPerk resets the tier traits. Fit with Fitness Instructor loses Fit and gets Athletic and Stout; High Weight gets Out of Shape. Measured on 2026-09-13: High Weight gained Out of Shape, Fit with Fitness Instructor lost Fit and gained Athletic and Stout. Checked again on 2026-09-21 on a newly created character: chosen Fit with Fitness Instructor, afterwards the character carries Athletic and Stout, and Fit is gone (Fitness 10, Strength 6). The Trait Facts overview had predicted exactly that.","code":"IsoGameCharacter.applyTraits (line 10441); server/XpSystem/XpUpdate.lua (lines 202-245)","method":"New character: on seven freshly created characters, ten ticks after OnNewGame, the chosen traits (IsoWorld.getLuaTraits, including profession traits) compared with those on the character; whatever was added or missing was set by the game during creation.","de":false,"status":"measured","handling":"Trait Facts says so in a note at the value.","proof":"play","values":[],"test":"new-character","traits":[{"key":"fit","name":"Fit"},{"key":"athletic","name":"Athletic"},{"key":"stout","name":"Stout"},{"key":"overweight","name":"High Weight"},{"key":"outofshape","name":"Out of Shape"}],"runs":["messung-2026-09-13-figur.txt","messung-2026-09-21-figur.txt"]},{"id":"sprintfaktor","title":"The sprint speed factors of five traits are never used","consequence":"The factors end up in a variable that is only read as yes/no.","code":"IsoPlayer.updateInternal2 (lines 2139, 2357)","method":"Sprint (fourth run): distance per tick while sprinting (Alt key) measured, Athletic and Unfit alternating over three phases each, first phase discarded as warm-up, factor checked against the detection limit of the scatter.","de":false,"status":"measured","handling":"Trait Facts shows the value greyed out, with the reason.","proof":"play","values":["athletic/sprintspeed","unfit/sprintspeed","outofshape/sprintspeed","overweight/sprintspeed","obese/sprintspeed"],"test":"sprint","traits":[{"key":"athletic","name":"Athletic"},{"key":"unfit","name":"Unfit"},{"key":"outofshape","name":"Out of Shape"},{"key":"overweight","name":"High Weight"},{"key":"obese","name":"Very High Weight"}],"runs":["messung-2026-09-10d-sprint.txt","messung-2026-09-10e-sprint.txt","messung-2026-09-10f-sprint.txt","messung-2026-09-13-sprint.txt"]},{"id":"speedmod-axeman","title":"Ax-pert's x0.95 swing factor sits in a method nothing calls","consequence":"The method has no caller, so the x0.95 never applies. Ax-pert speeds up the axe swing by a different route (IsoGameCharacter.calculateCombatSpeed); Trait Facts shows that as the measured axe swing time.","code":"HandWeapon.getSpeedMod (line 496; Ax-pert line 533), no caller","method":"","de":false,"status":"code","handling":"Trait Facts leaves this factor out, because it never applies.","proof":"code","values":[],"test":"","traits":[{"key":"axeman","name":"Ax-pert"}],"runs":[]},{"id":"handy-haltbarkeit","title":"Handy's +100 health for what you build is never used","consequence":"Reachable only through ISBuildIsoEntity:getHealth, which has no caller, and through legacy classes the build menu no longer creates. Measured on 2026-09-20 and 2026-09-21 (code values, as a function call): a wooden wall through setInfo has 470 health with and without Handy.","code":"server/BuildingObjects/ISBuildUtil.lua: getWoodHealth (line 39, Handy lines 48-49); ISBuildIsoEntity:getHealth (lines 38-43), no caller","method":"Code values: ISBuildIsoEntity:setInfo called directly, as create does when building (wooden wall WoodenWallLvl1 on a square next to the character), getMaxHealth of the new wall without and with Handy: 470 and 470; control check buildUtil.getWoodHealth 50 and 150. A function call, not a build in play.","de":false,"status":"measured","handling":"Trait Facts shows the value greyed out, with the reason.","proof":"call","values":["handy/durability"],"test":"code-values","traits":[{"key":"handy","name":"Handy"}],"runs":["messung-2026-09-20-werte.txt","messung-2026-09-21-werte.txt"]},{"id":"speeddemon-vorwaerts","title":"Speed Demon's faster rev build-up only works in reverse","consequence":"The forward version with the factor (control_Forward) has no caller; it only applies in reverse.","code":"CarController.control_Forward (line 463), no caller; update calls control_ForwardNew (line 236) and control_Reverse (line 233)","method":"Cars (acceleration test) with the SportsCar and the PickUpVan: RPM (getEngineSpeed) per speed window compared while starting from standstill with Speed Demon against the phase without the trait, forward and reverse separately.","de":false,"status":"measured","handling":"Trait Facts says so in a note at the value.","proof":"play","values":["speeddemon/rpmbuild"],"test":"cars","traits":[{"key":"speeddemon","name":"Speed Demon"}],"runs":["messung-2026-09-11e-beschleunigung.txt","messung-2026-09-11f-pickupvan.txt"]},{"id":"adrenaline-movespeed","title":"Adrenaline Junkie's x1.1 movement factor is never used","consequence":"Read only by getPathSpeed, which no other class uses. getMoveSpeed returns x1.1 only at Extreme Panic (level 4). Measured on 2026-09-20 and 2026-09-21 on the walking character: at Strong Panic (level 3) getMoveSpeed stays at x1.0, WalkSpeed is capped at 1.0 on both levels, and the distance with the trait is the same on both levels or even higher at level 3 (level 4 against level 3: x1.080 against x1.080, x1.084 against x1.082, x1.086 against x1.093, x1.082 against x1.082). So the x1.1 adds nothing. This holds for walking; when running and sprinting, WalkSpeed differs between the levels, so those runs are no control.","code":"IsoPlayer.getMoveSpeed (line 1662)","method":"Adrenaline: the character walks straight ahead, panic held at level 4 (nine phases) and in the later runs also at level 3 (five phases), 300 ticks each, alternating without and with Adrenaline Junkie; per phase WalkSpeed, getMoveSpeed and the distance per tick divided by the Multiplier.","de":false,"status":"measured","handling":"Trait Facts leaves this factor out, because it never applies.","proof":"play","values":["adrenalinejunkie/panicspeed"],"test":"adrenaline-speed-under-panic","traits":[{"key":"adrenalinejunkie","name":"Adrenaline Junkie"}],"runs":["messung-2026-09-20-adrenalin.txt","messung-2026-09-20b-adrenalin.txt","messung-2026-09-20c-adrenalin.txt","messung-2026-09-20d-adrenalin.txt","messung-2026-09-21-adrenalin.txt"]},{"id":"drinkfrombottle","title":"The drinking script with Iron Gut and Weak Stomach factors is never reached","consequence":"It contains Iron Gut x0.5 and Weak Stomach x1.5 for contaminated water. Drinking actually goes through DrinkFluid: Iron Gut 0, Weak Stomach x1.2.","code":"client/ISUI/ISInventoryPaneContextMenu.lua: doDrinkForThirstMenu (line 2340), no caller, the only path to onDrinkForThirst and ISDrinkFromBottle (lines 2359-2366)","method":"","de":false,"status":"code","handling":"Trait Facts leaves this factor out, because it never applies.","proof":"code","values":["irongut/taintedwater","weakstomach/taintedwater"],"test":"","traits":[{"key":"irongut","name":"Iron Gut"},{"key":"weakstomach","name":"Weak Stomach"}],"runs":[]},{"id":"appetit-satt","title":"Hearty Appetite and Light Eater have no effect while the character is full and not running or fighting","consequence":"With the moodle Full (FOOD_EATEN > 0), hunger does not grow while the character stands, walks, sprints or sleeps: the base rate for that is 0 (HungerIncreaseWhenWellFed), and the appetite factor is not applied there at all. While the character runs (not sprints) or attacks, shoves, stomps, grabs or picks up a body, hunger keeps growing, and a full character gets hungry three times as fast as one who is not full (HungerIncreaseWhenExercise against a third of it, 0.0000192 against 0.0000064 per step before sandbox, time and trait factors); there Hearty Appetite (x1.5) and Light Eater (x0.75) apply. The code does not say whether the third in the exercise branch is intended. Measured on 2026-09-13 while standing: 0.0000 per hour without and with Hearty Appetite, otherwise 0.0308. Light Eater and the running and fighting part come from the code, not from the measurement.","code":"IsoGameCharacter.updateStats_Awake (lines 9149-9159); IsoPlayer.updateStats_Sleeping (lines 2923-2927); shared/defines.lua (lines 14-16)","method":"Awake: hunger growth compared without and with Hearty Appetite while fullness was artificially held (healthFromFoodTimer kept high via setHealthFromFoodTimer), both practically without growth; both phases standing.","de":false,"status":"measured","handling":"Not in Trait Facts yet.","proof":"play","values":["heartyappetite/appetite","lighteater/appetite"],"test":"awake-tiredness-thirst-hunger","traits":[{"key":"heartyappetite","name":"Hearty Appetite"},{"key":"lighteater","name":"Light Eater"}],"runs":["messung-2026-09-13-wach.txt"]},{"id":"irongut-bleiche","title":"Iron Gut zeroes the poison of a drink that contains tainted water, even with bleach mixed in. Pure bleach still kills","consequence":"Pure bleach poisons with Iron Gut exactly as without it: it kills. Only when bleach sits in the same container as tainted water does Iron Gut zero the poison of the whole drink. Measured on 2026-09-14 (Code values): 0.5 l contaminated water with 0.1 l bleach gives 57.7500 poison without the trait, 0.0000 with Iron Gut (factor 0.0000); in the control test with pure bleach (0.1 l), 70.0000 without and with Iron Gut alike (factor 1.0000). Reproduced in play on 2026-09-21, God Mode off, the mixes poured by hand: a character with Iron Gut drank a bottle of about 1% tainted water and 99% bleach without harm. The same mix with 1% clean water poisoned the character, and pure bleach had killed a character with Iron Gut the same day. So a trace of tainted water in the container is enough; clean water does not zero the poison. Whether the bleach counts, though, depends on the largest share in the container (getPrimaryFluid, IsoGameCharacter line 5480): if clean water or another drink makes up most of it, Iron Gut halves the poison of the drink, bleach included (x0.5); this is from the code and not measured.","code":"IsoGameCharacter.DrinkFluid (lines 5500-5506)","method":"Code values: IsoGameCharacter.DrinkFluid triggered on the character with an emptied, refilled bleach bottle, poison set to 0 beforehand and read afterwards, without and with Iron Gut; factor with/without, tolerance 0.006, all character values reset afterwards.","de":false,"status":"measured","handling":"Trait Facts says so in a note at the value.","proof":"hand","values":["irongut/taintedwater","irongut/poison"],"test":"code-values","traits":[{"key":"irongut","name":"Iron Gut"}],"runs":["messung-2026-09-14-werte.txt","messung-2026-09-21-nachstellen.txt"]},{"id":"noisedistance-mp","title":"The hearing radius (noiseDistance) never applies","consequence":"calculateVisibilityData computes the radius (base 2, Keen Hearing +3, Hard of Hearing -1), and only IsoGridSquare.CalcVisibility reads it. Only the ServerLOS thread calls either (ServerLOS lines 271 and 277), and only GameServer.main (line 831) starts it, on a multiplayer server. Exactly there CalcVisibility skips the check on the radius and on Deaf, because it sits inside if (!GameServer.server) (lines 7729-7735). In single player and on the client, LightingJNI.updatePlayer (lines 481-484) passes only the sight cone and getDetectionRange on to perception. So the radius is computed and read in no game mode. Until 2026-09-23 this entry said it only applied on multiplayer servers. That was wrong. As a side note: the +0.2 of Eagle Eyed in the cone of the same calculation does apply on the server, because CalcVisibility reads the cone outside the check (line 7737); Trait Facts does not show it, and it has nothing to do with the +36° field of view.","code":"IsoGridSquare.CalcVisibility (lines 7729-7735, check inside if (!GameServer.server)); ServerLOS (lines 271, 277) as the only caller, started only in GameServer.main (line 831, server = true in line 408); IsoGameCharacter.calculateVisibilityData (lines 15169-15194); LightingJNI.updatePlayer (lines 481-484)","method":"","de":false,"status":"code","handling":"Trait Facts shows the value greyed out, with the reason.","proof":"code","values":["keenhearing/noise","hardofhearing/noise","deaf/noise"],"test":"","traits":[{"key":"keenhearing","name":"Keen Hearing"},{"key":"hardofhearing","name":"Hard of Hearing"},{"key":"deaf","name":"Deaf"}],"runs":[]},{"id":"unfallbruch","title":"Car-crash fractures skip Fast and Slow Healer's fracture-time factor (0.6 and 1.8)","consequence":"IsoPlayer and BaseVehicle call generateFracture directly instead of generateFractureNew; the trait acts there only through the crash damage (x0.8 with Fast Healer, x1.2 with Slow Healer), which sets both the fracture chance and the fracture time. Measured on 2026-09-14 (Code values): mean fracture time without trait 37.6784, with Fast Healer 35.1779 (factor 0.9336), with Slow Healer 40.9039 (factor 1.0856), 1200 samples over 72 ticks per case, measured when hit by a car (IsoPlayer.applyDamageFromVehicleHit); per code, 0.9202 and 1.0798, purely through the damage, instead of 0.6 and 1.8 from generateFractureNew. In a crash while driving (BaseVehicle lines 8528-8532) the fracture-time factor is missing as well, but that path has its own fracture rule (damage over 50, a 1 in 10 roll, only if the deep wound roll before it missed) and time formula; it is not measured.","code":"IsoPlayer (lines 1984-1990) and BaseVehicle (line 8532) call BodyPart.generateFracture (line 818) directly; only falls (IsoGameCharacter lines 2139, 2151) go through generateFractureNew (line 828)","method":"Code values: same samples as the accident damage (IsoPlayer.applyDamageFromVehicleHit, CarNormal alongside, God Mode off, sandbox set to Normal), fracture time of all fractures averaged per case; factor with/without checked against the value per code without the trait factor, tolerance 4%.","de":false,"status":"measured","handling":"Trait Facts says so in a note at the value.","proof":"call","values":["fasthealer/fracture","slowhealer/fracture"],"test":"code-values","traits":[{"key":"fasthealer","name":"Fast Healer"},{"key":"slowhealer","name":"Slow Healer"}],"runs":["messung-2026-09-14-werte.txt"]},{"id":"erkaeltung-schwelle","title":"Resilient and Outdoorsy: no risk of a cold at all in mild cold","consequence":"The decay of catchACold asks for the same delta as the build-up, but already with the trait factor applied, and then subtracts a fixed 0.175, far more than one update adds. With Resilient the risk of a cold therefore only grows from delta 0.22, with Outdoorsy only from 0.4; below that it stays at 0 instead of x0.45 or x0.25. Measured on 2026-09-20 (code values) at delta 0.12 to 0.2: gain without trait 1.0000, with Resilient 0.0000, with Outdoorsy 0.0000. The thresholds 0.22 and 0.4 follow from the code (0.1/0.45 and 0.1/0.25); only 0.12 to 0.2 was measured. With Prone to Illness and Outdoorsy the threshold is 0.235, with Resilient and Outdoorsy 0.89.","code":"BodyDamage.UpdateWetness (build-up lines 731-743, decay lines 751-756); CatchAColdDecreaseRate 0.175 (shared/defines.lua:40, without Multiplier)","method":"Code values: skin cooled in small steps only to delta 0.12 to 0.2, then as for the cold setCatchACold(0), UpdateWetness, getCatchACold; without trait, with Resilient and with Outdoorsy.","de":false,"status":"measured","handling":"Trait Facts says so in a note at the value.","proof":"call","values":["resilient/coldmild","outdoorsman/coldmild","resilient/cold","outdoorsman/cold"],"test":"code-values","traits":[{"key":"resilient","name":"Resilient"},{"key":"outdoorsman","name":"Outdoorsy"}],"runs":["messung-2026-09-20-werte.txt"]},{"id":"grapple-schwelle","title":"The grapple factors of nine traits are only checked against 0.5, and no character gets that low","consequence":"calculateGrappleEffectivenessFromTraits multiplies Strong x1.25, Athletic x1.25, Speed Demon x1.15, Brave x1.1, High Weight x1.1, Very High Weight x1.05, Cowardly x0.9, Very Low Weight x0.8 and Emaciated x0.6 onto 1.0. Both callers (picking up a corpse and grabbing in combat) pass the result to Grappled, and there it only appears in the check for below 0.5: then the grab is refused. Nothing reads the value after that, neither for grabbing nor for dragging. No character gets below 0.5, because the game always keeps exactly one weight trait (Nutrition.applyTraitFromWeight); the lowest value is 0.54 with Emaciated and Cowardly. Only Emaciated and Very Low Weight at the same time (0.48), which only debug tools or mods create, would get a grab refused. The getter measurements of 2026-09-10 only show the returned values.","code":"IsoGameCharacter.calculateGrappleEffectivenessFromTraits (lines 7917-7946); BaseGrappleable.Grappled (lines 70-94, threshold line 75); IsoDeadBody.Grappled (lines 1770-1799, threshold line 1775); callers IsoGameCharacter.pickUpCorpse (lines 7912-7913) and SwipeStatePlayer (lines 524-530); Nutrition.applyTraitFromWeight (lines 203-224)","method":"","de":false,"status":"code","handling":"Trait Facts shows the value greyed out, with the reason.","proof":"code","values":["strong/grapple","athletic/grapple","speeddemon/grapple","brave/grapple","cowardly/grapple","overweight/grapple","obese/grapple","veryunderweight/grapple","emaciated/grapple"],"test":"","traits":[{"key":"strong","name":"Strong"},{"key":"athletic","name":"Athletic"},{"key":"speeddemon","name":"Speed Demon"},{"key":"brave","name":"Brave"},{"key":"cowardly","name":"Cowardly"},{"key":"overweight","name":"High Weight"},{"key":"obese","name":"Very High Weight"},{"key":"veryunderweight","name":"Very Low Weight"},{"key":"emaciated","name":"Emaciated"}],"runs":[]},{"id":"sammeln-dunkelheit-beruf","title":"Professions never reduce the foraging darkness penalty","consequence":"getDarknessEffectReduction looks up the profession definition with the CharacterProfession object instead of its name. The table is keyed by name, so the lookup always comes back empty, and only the share from traits counts (for example Outdoorsy -5%). This affects Park Ranger, Veteran, Lumberjack and Burglar (-15%), Farmer, Fisherman, Security Guard, Police Officer and Fire Officer (-10%) and Unemployed (-5%). The sister functions for weather, sight radius and categories use :getName() and work. The game's own foraging tooltip (ISZoneDisplay) reads the same function and also shows only the share from traits. Trait Facts leaves the profession row out of the overview and its total.","code":"shared/Foraging/forageSystem.lua (line 1869, without :getName(); weather line 1820, sight radius line 1910 and categories line 1711 with :getName()); table keyed by name: forageSkills.lua (line 5), addSkillDef (line 1629)","method":"Console, 2026-09-23 and 24: two Park Ranger characters without darkness traits, print(forageSystem.getDarknessEffectReduction(getPlayer())) returns 1; with a working occupation bonus it would be 0.85 (docs/messungen/messung-2026-09-24-von-hand.txt).","de":false,"status":"measured","handling":"Trait Facts leaves this factor out, because it never applies.","proof":"call","values":[],"test":"","traits":[],"runs":["messung-2026-09-24-von-hand.txt"]},{"id":"kletterwert-eins","title":"A climbing score of 1 to 3 always fails at tall fences, worse than 0 (without a heavy load)","consequence":"At tall fences the game rolls 1 in the root of the climbing score. At root 1 (a sum of 1 to 3) Rand.NextBool(1) is always true, so the character fails every time. At root 0, though, without a heavy load it succeeds with Rand.Next(100) <= max(1, Strength), 6 times in 100 at Strength 5 (never with a heavy load). Pathfinding routes over tall fences from a score of 1, so it sends the character to fences where it always fails. This hits for example a new character without gloves with High Weight (Fitness 4, 18 - 15 = 3; gloves add 4) or Clumsy with High Weight. From the code, not measured in play. Not with the sandbox option Easy Climbing (on in the Rising preset): then every climb succeeds without a roll (ClimbOverWallState lines 292-294).","code":"ClimbOverWallState (lines 296-311, roll line 306); RandInterface.NextBool (lines 24-25), RandAbstract.Next (lines 20-28); IsoGameCharacter.getClimbingFailChanceFloat (lines 14718-14754, root line 14753); PathFindRequest (line 77)","method":"","de":false,"status":"code","handling":"Trait Facts says so in a note at the value.","proof":"code","values":["overweight/climb"],"test":"","traits":[{"key":"overweight","name":"High Weight"},{"key":"clumsy","name":"Clumsy"}],"runs":[]}],"game":{"adrenalinejunkie":["Moves faster when highly panicked."],"agoraphobic":["Gets panicked when outdoors."],"allthumbs":["Transfers inventory items slowly. Can't craft anything while walking.","Slower rope climbing speed, and higher chance of falling.","Slower weapon shouldering time."],"asthmatic":["Faster endurance loss."],"athletic":["Faster running speed.","Can run for longer without tiring."],"axeman":["Better at chopping trees.","Faster axe swing."],"brave":["Less prone to becoming panicked."],"burglar":["Can hotwire vehicles. Less chance of breaking window locks."],"claustrophobic":["Gets panicked when in small indoor rooms."],"clumsy":["Makes more noise when moving."],"conspicuous":["More likely to be spotted by zombies."],"cowardly":["Especially prone to becoming panicked."],"crafty":["Increased XP gains for Crafting skills."],"deaf":["Can't hear sound."],"desensitized":["Far less prone to panic.","Ignore discomfort."],"dextrous":["Transfers inventory items quickly.","Faster rope climbing speed, and less chance of falling.","Faster weapon shouldering time."],"disorganized":["Decreased container inventory capacity.","Affects world containers and bags, but not your main inventory."],"eagleeyed":["Faster visibility fade.","Higher visibility arc.","Weapon sights more effective at long range."],"emaciated":["Low strength, low endurance and prone to injury."],"fasthealer":["Recovers quickly from injuries and illness."],"fastlearner":["Increased XP gains."],"fastreader":["Takes less time to read books."],"feeble":["Less knockback from melee weapons.","Decreased carrying weight."],"graceful":["Makes less noise when moving."],"handy":["Faster and stronger constructions."],"hardofhearing":["Smaller perception radius.","Smaller hearing range."],"heartyappetite":["Needs to eat more regularly."],"hemophobic":["Panic when performing first aid on self.","Cannot perform first aid on others.","Gets stressed when bloody."],"highthirst":["Needs more water to survive."],"illiterate":["Cannot read any books or in-world text."],"inconspicuous":["Less likely to be spotted by zombies."],"insomniac":["Slow loss of tiredness while sleeping."],"inventive":["Has lower skill level requirements to research recipes from items or auto learn recipes."],"irongut":["Less chance to have food illness."],"keenhearing":["Larger perception radius."],"lighteater":["Needs to eat less regularly."],"lowthirst":["Needs less water to survive."],"marksman":["Improved gun accuracy and damage.","Quicker reload."],"needslesssleep":["Needs less sleep."],"needsmoresleep":["Needs more sleep."],"nightowl":["Requires little sleep.","Stays extra alert even when sleeping."],"nightvision":["Better vision at night."],"nutritionist":["Can see the nutritional values of any food."],"obese":["Reduced running speed, very low endurance and prone to injury."],"organized":["Increased container inventory capacity."],"outdoorsman":["Less affected by harsh weather conditions."],"outofshape":["Low endurance, low endurance regeneration."],"overweight":["Reduced running speed, low endurance and prone to injury."],"pacifist":["Decreased combat XP gains."],"pronetoillness":["More prone to disease.","Faster rate of zombification."],"resilient":["Less prone to disease.","Slower rate of zombification."],"shortsighted":["Smaller view distance.","Slower visibility fade.","Weapon sights less effective."],"slowhealer":["Recovers slowly from injuries and illness."],"slowlearner":["Decreased XP gains."],"slowreader":["Takes longer to read books and other literature."],"smoker":["Unhappiness rises when tobacco is not smoked.","Stress and unhappiness decrease after smoking tobacco."],"speeddemon":["Drives very fast."],"stout":["Extra knockback from melee weapons.","Increased carrying weight."],"strong":["Extra knockback from melee weapons.","Increased carrying weight."],"sundaydriver":["Drives very slow."],"thickskinned":["Lower chance of being scratched or bitten."],"thinskinned":["Higher chance of being scratched or bitten by zombies."],"underweight":["Low strength, low endurance and prone to injury."],"unfit":["Very low endurance and endurance regeneration."],"veryunderweight":["Very low strength, very low endurance and prone to injury."],"weak":["Far less knockback from melee weapons.","Extremely small carrying weight."],"weakstomach":["Higher chance to have food illness."],"weightgain":["Permanent tendency to gain weight. Starts with High Weight trait."],"weightloss":["Permanent tendency to lose weight. Starts with Low Weight trait."],"wildernessknowledge":["Can find medicinal herbs and craft medicines and poultices from them, and make simple stone and bone tools.","Start fires faster."],"formerscout":["Start fires faster."]},"logs":"https://github.com/bluehelix-mods/trait-facts/blob/main/docs/messungen/","tests":[{"name":"Axe: Ax-pert","measures":"How fast Ax-pert chops trees, how much damage it does to them and how fast it swings.","how":"The test mod fells a tree with and without the trait, then times swings into the air.","id":"axe-ax-pert"},{"name":"Adrenaline: speed under panic","measures":"Whether Adrenaline Junkie makes you walk, run and sprint faster while panicking.","how":"The character moves outdoors while the test mod holds panic at a fixed level and switches the trait on and off. The distance covered is compared.","id":"adrenaline-speed-under-panic"},{"name":"Climbing","measures":"The climbing score, which decides how often you fail to climb a tall fence, and the climbing speed on sheet ropes, for Fitness, Strength and Nimble at every level, and for traits like Clumsy, Gymnast or the weight traits. It reads the game's numbers; it does not make the character climb or fall.","how":"The test mod steps each skill from 0 to 10 and compares the game's numbers with the formula.","id":"climbing"},{"name":"New character","measures":"Carry capacity and the fitness and strength traits a new character ends up with.","how":"Seven characters are created with different traits, and the test mod reads each one right after the start.","id":"new-character"},{"name":"Code values","measures":"About 100 values that can be read directly on a character, such as panic, hit force, wound healing, action times or illness.","how":"The test mod adds a trait, reads the value, removes the trait and reads it again. Values that change slowly are sampled over time.","id":"code-values"},{"name":"Panic outdoors","measures":"How fast Agoraphobic builds up panic outside.","how":"The character stands outdoors while the test mod switches the trait on and off and measures panic per second.","id":"panic-outdoors"},{"name":"Blood and noise","measures":"Panic and stress from blood with Fear of Blood, and whether Deaf removes stress from noise.","how":"The test mod makes the character bleed, hands it bloody axes and plays loud sounds, each with and without the trait.","id":"blood-and-noise"},{"name":"Awake: tiredness, thirst, hunger","measures":"How fast traits like Wakeful, High Thirst or Light Eater change tiredness, thirst and hunger.","how":"The character stands still for a few in-game hours while the traits take turns. Each phase is compared with the ones around it.","id":"awake-tiredness-thirst-hunger"},{"name":"Sleep","measures":"How long you sleep, how fast you fall asleep and how fast you recover, for Restless Sleeper, Wakeful, Sleepyhead and Night Owl.","how":"The character lies down, and the test mod runs the game's sleep code hundreds of times per trait.","id":"sleep"},{"name":"Fade-in: Eagle Eyed, Short Sighted","measures":"How fast zombies fade into view.","how":"The test mod places a harmless zombie nearby, hides it again and again and measures how fast it comes back.","id":"fade-in-eagle-eyed-short-sighted"},{"name":"Running: endurance loss","measures":"How fast endurance drops while running with High Weight, Athletic or Short of Breath.","how":"The character runs while the test mod refills endurance all the time and measures each drop.","id":"running-endurance-loss"},{"name":"In the car: claustrophobia and hotwiring","measures":"Claustrophobic's panic in a car, and which skills or traits allow hotwiring.","how":"Panic is measured like outdoors. For hotwiring, the test mod checks which option the game's menu would offer.","id":"in-the-car-claustrophobia-and-hotwiring"},{"name":"World entry","measures":"The readable effects of every trait in one pass, including foraging, XP and bag capacity.","how":"Runs by itself when a character enters the world. Each trait is added and removed in turn.","id":"world-entry"},{"name":"Sprint","measures":"Whether Athletic and Unfit change sprint speed.","how":"The character sprints outdoors while the traits take turns, and the distance per step is compared.","id":"sprint"},{"name":"Cars","measures":"How Speed Demon and Sunday Driver change top speed and acceleration, in five different cars.","how":"The character drives at full throttle while the traits take turns. Top speed and pulling force are compared.","id":"cars"},{"name":"XP ladder","measures":"XP gain per skill at every skill level and every boost level, without any trait. Fast Learner and Slow Learner are not part of this test. They were measured in the world entry runs.","how":"The test mod adds XP to a character and reads back what arrives.","id":"xp-ladder"},{"name":"Level traits","measures":"Which fitness and strength trait, like Fit or Weak, the game gives at each skill level.","how":"The test mod raises each skill from 0 to 10 and notes the trait the game assigns.","id":"level-traits"},{"name":"Character creation","measures":"Which level traits a new character really gets, compared with what Trait Facts predicts.","how":"Eleven trait combinations are applied to a test character the way the game does at creation.","id":"character-creation"},{"name":"Patch day run","measures":"All automatic tests in one go, to see whether a game update changed anything.","how":"One click runs them one after another and lists anything that differs.","id":"patch-day-run"}],"why":"Some effects only exist on a character standing in the world, like carry capacity or hearing range. A separate test mod loads a throwaway save, turns each trait on and off and reads the values. It is a development tool and not part of the mod."}</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  // Ein Wort je Stand, ueberall dasselbe: label im Kaestchen, many als Ueberschrift, text als Erklaerung.
  var STATUS = {
    measured: { label: "Measured", many: "Measured in the game", text: "Checked in the running game with a test mod: either watched in play, or by calling the game's own function on a live character. The most certain." },
    code: { label: "From code", many: "From the game code", text: "Read from the game code only. It shows what the code says, not that the code runs, so it is a little less certain." },
    dead: { label: "No effect", many: "No effect in play", text: "The number is in the game code, but it changes nothing in play. Do not pick a trait for it. The trait's other values still work." },
    open: { label: "Open", many: "Open", text: "Code and measurement disagree." }
  };
  var ORDER = ["measured", "code", "dead"];
  var main = document.getElementById("main");
  var list = document.getElementById("list");
  var search = document.getElementById("search");
  var browse = document.getElementById("browse");
  var narrow = window.matchMedia("(max-width:820px)");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function pill(status, link) {
    var s = STATUS[status] || { label: status };
    return link
      ? '<a class="pill ' + esc(status) + '" href="#/values/' + esc(status) + '">' + esc(s.label) + "</a>"
      : '<span class="pill ' + esc(status) + '">' + esc(s.label) + "</span>";
  }
  function dePill(flag) {
    return flag ? '<span class="pill de" title="Not translated yet, shown in the original German">DE</span>' : "";
  }
  function slug(key) { return String(key).toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function valueHref(v) { return "#/trait/" + v.id; }
  function cardId(id) { return "v-" + id.replace("/", "-"); }
  function counts(values) {
    var n = { measured: 0, code: 0, dead: 0, open: 0 };
    values.forEach(function (v) { n[v.status] = (n[v.status] || 0) + 1; });
    return n;
  }
  function countText(n) {
    var parts = [];
    if (n.measured) parts.push(n.measured + " measured");
    if (n.code) parts.push(n.code + " from code");
    if (n.dead) parts.push(n.dead + " no effect");
    if (n.open) parts.push(n.open + " open");
    return parts.join(", ");
  }

  var traits = {}, valueById = {}, bugById = {}, testById = {};
  D.values.forEach(function (v) {
    var t = traits[v.trait] || (traits[v.trait] = { key: v.trait, name: v.name, cost: v.cost, values: [] });
    t.values.push(v);
    valueById[v.id] = v;
  });
  var RANK = { measured: 0, open: 1, code: 2, dead: 3 };
  Object.keys(traits).forEach(function (k) {
    var t = traits[k];
    // sort ist nicht ueberall stabil: der Platz in den Daten entscheidet bei gleichem Stand.
    t.values = t.values.map(function (v, i) { return [v, i]; }).sort(function (a, b) {
      return (RANK[a[0].status] - RANK[b[0].status]) || (a[1] - b[1]);
    }).map(function (x) { return x[0]; });
    t.bugs = D.bugs.filter(function (b) { return b.traits.some(function (x) { return slug(x.key) === k; }); });
  });
  D.bugs.forEach(function (b) { bugById[b.id] = b; });
  D.tests.forEach(function (t) { t.used = 0; testById[t.id] = t; });
  D.values.concat(D.bugs).forEach(function (x) { if (x.test && testById[x.test]) testById[x.test].used += 1; });

  var GROUPS = ["Positive traits", "Negative traits", "Free traits (occupation, weight)", "Other"];
  function groupOf(t) {
    if (t.cost == null) return "Other";
    if (t.cost > 0) return "Positive traits";
    if (t.cost < 0) return "Negative traits";
    return "Free traits (occupation, weight)";
  }
  // Eine Reihenfolge fuer Liste und Blaettern: erst die Gruppe, dann der Name.
  var traitList = Object.keys(traits).map(function (k) { return traits[k]; }).sort(function (a, b) {
    return (GROUPS.indexOf(groupOf(a)) - GROUPS.indexOf(groupOf(b))) || a.name.localeCompare(b.name);
  });
  var byName = traitList.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });

  // --- Seitenleiste ---------------------------------------------------------
  function has(text, q) { return String(text || "").toLowerCase().indexOf(q) >= 0; }
  function markHit(text, q) {
    var i = q ? text.toLowerCase().indexOf(q) : -1;
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
  }
  function currentKey() { return (location.hash.match(/^#\/trait\/([^/]+)/) || [])[1]; }

  function renderList() {
    var q = search.value.trim().toLowerCase();
    var current = currentKey();
    var html = "", nTraits = 0, nHits = 0;
    GROUPS.forEach(function (g) {
      var rows = [];
      traitList.forEach(function (t) {
        if (groupOf(t) !== g) return;
        // Der Name im Spiel und der Schluessel im Spielcode: "Puny" heisst dort WEAK,
        // "Low Weight" UNDERWEIGHT. Wer den alten Namen tippt, findet den Trait trotzdem.
        var named = !q || has(t.name, q) || has(t.key, q);
        var hits = q ? t.values.filter(function (v) { return has(v.effect, q) || has(v.ingame, q) || has(v.code, q); }) : [];
        if (named || hits.length) rows.push({ t: t, hits: hits, byKey: q && !has(t.name, q) && has(t.key, q) });
      });
      if (!rows.length) return;
      html += '<h2 class="group">' + esc(g) + "</h2><ul>";
      rows.forEach(function (r) {
        var t = r.t, n = counts(t.values);
        nTraits += 1; nHits += r.hits.length;
        html += '<li><a href="#/trait/' + esc(t.key) + '" data-key="' + esc(t.key) + '"' + (t.key === current ? ' aria-current="page"' : "") + ">"
          + "<span>" + markHit(t.name, q) + (r.byKey ? ' <span class="aka">in the game code: ' + markHit(t.key, q) + "</span>" : "") + "</span>"
          + '<span class="n" aria-hidden="true">'
          + t.values.map(function (v) { return '<i class="dot ' + esc(v.status) + '"></i>'; }).join("")
          + (t.bugs.length ? '<i class="dot bug"></i>' : "")
          + '</span><span class="sr">' + esc(countText(n) + (t.bugs.length ? ", game bug" : "")) + "</span></a>";
        // Wer nach einer Wirkung sucht, sieht sie unter dem Trait und springt direkt hin.
        r.hits.forEach(function (v) {
          html += '<a class="hit" href="' + esc(valueHref(v)) + '">' + esc(v.value) + " " + markHit(v.effect, q) + "</a>";
        });
        html += "</li>";
      });
      html += "</ul>";
    });
    var bugs = q ? D.bugs.filter(function (b) { return has(b.title, q); }) : [];
    if (bugs.length) {
      html += '<h2 class="group">Game bugs</h2><ul>' + bugs.map(function (b) {
        return '<li><a href="#/bugs/' + esc(b.id) + '"><span>' + markHit(b.title, q) + "</span></a></li>";
      }).join("") + "</ul>";
    }
    list.innerHTML = html || '<p class="empty">Nothing matches.</p>';
    var filter = document.getElementById("filter");
    filter.hidden = !q;
    if (q) {
      filter.innerHTML = "Showing " + nTraits + " of " + traitList.length + " traits. <button type=\"button\" id=\"clear\">Clear</button>";
      document.getElementById("clear").onclick = function () { search.value = ""; renderList(); search.focus(); };
      browse.open = true;
    }
    document.getElementById("count").textContent = q
      ? nTraits + " traits, " + nHits + " effects, " + bugs.length + " game bugs match" : "";
  }
  // Beim Seitenwechsel wird die Liste nicht neu gebaut (der Fokus bliebe sonst
  // nicht stehen): nur die Marke wandert, und der Trait rueckt ins Bild.
  function markCurrent() {
    var current = currentKey(), found = null;
    Array.prototype.forEach.call(list.querySelectorAll("a[data-key]"), function (a) {
      if (a.getAttribute("data-key") === current) { a.setAttribute("aria-current", "page"); found = a; }
      else a.removeAttribute("aria-current");
    });
    if (!found) return;
    var box = narrow.matches ? list : document.querySelector(".side");
    var top = found.getBoundingClientRect().top - box.getBoundingClientRect().top;
    if (top < 40 || top > box.clientHeight - 60) box.scrollTop += top - box.clientHeight / 3;
  }

  // --- Bausteine ------------------------------------------------------------
  function runLinks(files) {
    return '<div class="files">' + files.map(function (f) {
      return '<a href="' + esc(D.logs + f) + '">' + esc(f) + "</a>";
    }).join("") + "</div>";
  }
  function testLink(id) {
    var t = testById[id];
    return t ? '<a href="#/testing/' + esc(id) + '">Test: ' + esc(t.name) + "</a>. " : "";
  }
  function evidence(rows) {
    // Streifen hinter jeder zweiten Zeile, wie in der Uebersicht im Spiel.
    return '<dl class="ev">' + rows.map(function (r, i) {
      var alt = i % 2 ? ' class="alt"' : "";
      return "<dt" + alt + ">" + esc(r[0]) + "</dt><dd" + alt + ">" + r[1] + "</dd>";
    }).join("") + "</dl>";
  }
  // Wie ein Eintrag belegt ist; die Erklaerung dazu steht auf "How it is tested".
  var PROOF = {
    hand: "reproduced in play by hand",
    play: "measured in play",
    call: "function call on a live character",
    code: "game code only"
  };
  function proof(rows, open, kind) {
    return rows.length ? '<details class="proof"' + (open ? " open" : "") + "><summary>Evidence"
      + (PROOF[kind] ? ' <span class="kind ' + esc(kind) + '">' + esc(PROOF[kind]) + "</span>" : "")
      + "</summary>" + evidence(rows) + "</details>" : "";
  }
  var showAll = false;
  try { showAll = localStorage.getItem("tf-evidence") === "1"; } catch (e) { showAll = false; }

  function valueCard(v, open) {
    // Erst das Ergebnis, dann wie es zustande kam, dann die Stelle im Code:
    // wer an einer Zahl zweifelt, fragt zuerst "stimmt sie".
    var rows = [];
    if (v.note) rows.push(["Result", esc(v.note)]);
    if (v.method || v.test) rows.push(["How tested", testLink(v.test) + esc(v.method)]);
    if (v.code) rows.push(["Game code", esc(v.code)]);
    if (v.live) rows.push(["Live", "The mod reads this number from the game each time it starts. If a game patch changes it, the mod shows the new number. The number here is for build " + esc(D.build) + "."]);
    if (v.runs.length) rows.push(["Test logs", runLinks(v.runs)]);
    var hid = cardId(v.id) + "-h";
    var plain = v.plain && v.status !== "dead" ? v.value + " means " + v.plain + "." : "";
    return '<section class="value ' + esc(v.status) + '" id="' + esc(cardId(v.id)) + '" aria-labelledby="' + esc(hid) + '">'
      + '<div class="head"><span class="fig ' + esc(v.tone) + '">' + esc(v.value) + '</span><h2 class="eff" id="' + esc(hid) + '">' + esc(v.effect) + "</h2>"
      + '<span class="marks">' + (v.live ? '<a class="pill live" href="#/values/live">Live</a>' : "")
      + pill(v.status, true) + dePill(v.de)
      + v.bugs.map(function (id) { return '<a class="pill bug" href="#/bugs/' + esc(id) + '">Game bug</a>'; }).join("")
      + '<a class="anchor" href="' + esc(valueHref(v)) + '" title="Link to this value" aria-label="Link to ' + esc(v.effect) + '">#</a></span>'
      + (v.ingame ? '<span class="ingame">' + (v.status === "dead" ? "Why: " : "In the game, Trait Facts adds: ") + esc(v.ingame) + "</span>" : "")
      + (plain ? '<span class="plain">' + esc(plain) + "</span>" : "")
      + "</div>" + proof(rows, open || showAll, v.proof) + "</section>";
  }

  function reportBox(what) {
    return '<aside class="report"><p><b>' + esc(what) + ' looks wrong?</b> <a href="' + esc(D.report) + '">Report it</a>'
      + (D.workshop ? ", in the Bug reports thread on the Workshop page or on GitHub." : ".")
      + " Name the trait and the value, mod " + esc(D.version) + " and game build " + esc(D.build)
      + ". The # at a value gives you a link to it.</p></aside>";
  }

  function pager(key) {
    var i = traitList.map(function (t) { return t.key; }).indexOf(key);
    var prev = traitList[i - 1], next = traitList[i + 1];
    return '<nav class="pager" aria-label="Neighbouring traits">'
      + (prev ? '<a href="#/trait/' + esc(prev.key) + '"><small>Previous</small>' + esc(prev.name) + "</a>" : "<span></span>")
      + (next ? '<a href="#/trait/' + esc(next.key) + '" style="text-align:right"><small>Next</small>' + esc(next.name) + "</a>" : "")
      + "</nav>";
  }

  // --- Seiten ---------------------------------------------------------------
  function pageNotFound(what, word) {
    var near = word ? byName.filter(function (t) { return has(t.name, word.slice(0, 3)) || has(t.key, word.slice(0, 3)); }).slice(0, 6) : [];
    return '<p class="eyebrow">Not found</p><h1>No ' + esc(what) + " called " + esc(word) + "</h1>"
      + '<p class="lede">The link may be old. '
      + (near.length ? "Close names: " + near.map(function (t) { return '<a href="#/trait/' + esc(t.key) + '">' + esc(t.name) + "</a>"; }).join(", ") + ". " : "")
      + 'Use the search on the left or go to the <a href="#/">overview</a>.</p>';
  }

  function pageTrait(key, open) {
    var t = traits[key];
    if (!t) return pageNotFound("trait", key);
    var bugs = t.bugs;
    var cost = t.cost == null ? "" : (t.cost > 0 ? "costs " + t.cost + " points" : t.cost < 0 ? "gives " + (-t.cost) + " points" : "free");
    var game = (D.game || {})[key];
    var html = '<p class="eyebrow">Trait' + (cost ? " · " + esc(cost) : "") + "</p><h1>" + esc(t.name) + "</h1>"
      + '<section class="game" aria-labelledby="game-h"><h2 id="game-h">What the game says</h2>'
      + (game && game.length
        ? "<ul>" + game.map(function (line) { return "<li>" + esc(line) + "</li>"; }).join("") + "</ul>"
        : "<p>The game shows no description for this trait, only its skill boosts.</p>")
      + "</section>"
      + '<div class="tools"><button type="button" id="toggle" aria-pressed="' + showAll + '">' + (showAll ? "Hide evidence" : "Show all evidence") + "</button></div>"
      + t.values.map(function (v) { return valueCard(v, open === v.id); }).join("");
    if (bugs.length) {
      html += '<h2 id="trait-bugs">Game bugs around this trait</h2>' + bugs.map(function (b) {
        return '<div class="card"><div class="row"><span class="pill bug">Game bug</span></div><h3><a href="#/bugs/' + esc(b.id) + '">'
          + esc(b.title) + "</a></h3><p>" + esc(b.consequence) + "</p></div>";
      }).join("");
    }
    return html + reportBox("A number") + pager(key);
  }

  function pageHome() {
    var n = counts(D.values), total = D.values.length;
    function tile(cls, href, number, text) {
      return '<a class="count ' + cls + '" href="' + href + '"><b>' + number + "</b><span>" + esc(text) + "</span></a>";
    }
    function cell(x) { return '<td class="num' + (x ? "" : " zero") + '">' + x + "</td>"; }
    var anyDe = D.values.concat(D.bugs).some(function (x) { return x.de; });
    return '<p class="eyebrow">A mod for Project Zomboid · build ' + esc(D.build) + "</p>"
      + "<h1>What each trait really does, with the evidence</h1>"
      + '<p class="lede">Trait Facts is a mod for Project Zomboid. It shows what your traits really do, as numbers, on the character creation screen'
      + (D.workshop ? ' (<a href="' + esc(D.workshop) + '">get it on the Steam Workshop</a>)' : "") + ". "
      + "This site lists all " + total + " numbers for " + traitList.length + " traits and shows how each one was checked. "
      + "Pick a trait on the left or type its name in the search box.</p>"
      + '<div class="counts">'
      + tile("measured", "#/values/measured", n.measured, "of " + total + " measured in the game")
      + tile("code", "#/values/code", n.code, "from the game code only")
      + tile("dead", "#/values/dead", n.dead, "numbers that do nothing")
      + tile("bug", "#/bugs", D.bugs.length, "game bugs and quirks") + "</div>"
      + '<h2 id="labels">Labels</h2><ul class="legend">'
      + ORDER.map(function (s) { return "<li><span>" + pill(s, true) + "</span><span>" + esc(STATUS[s].text) + "</span></li>"; }).join("")
      + '<li><span><a class="pill live" href="#/values/live">Live</a></span><span>The mod also reads this number from the game each time it starts, so game patches are included. It reads only the game\'s own trait list: no files on your PC, nothing is sent, nothing is saved.</span></li>'
      + '<li><span><span class="pill bug">Game bug</span></span><span>The game does something other than its description or the intent of its code suggests. Trait Facts does not fix these. Listed under <a href="#/bugs">Game bugs</a>.</span></li>'
      + (anyDe ? "<li><span>" + dePill(true) + "</span><span>This text is not translated yet and shows in German.</span></li>" : "")
      + "</ul>" + reportBox("A number")
      + '<h2 id="all-traits">All traits</h2>'
      + '<div class="scroll" tabindex="0" role="region" aria-label="All traits"><table><caption class="sr">All traits with the number of values by label</caption>'
      + '<thead><tr><th scope="col">Trait</th><th scope="col" class="num">Numbers</th><th scope="col" class="num">Measured</th><th scope="col" class="num">From code</th><th scope="col" class="num">No effect</th><th scope="col" class="num">Game bugs</th></tr></thead><tbody>'
      + byName.map(function (t) {
        var c = counts(t.values);
        var bugs = t.bugs.length;
        return '<tr><th scope="row" class="nowrap"><a href="#/trait/' + esc(t.key) + '">' + esc(t.name) + "</a></th>"
          + '<td class="num">' + t.values.length + "</td>" + cell(c.measured) + cell(c.code) + cell(c.dead) + cell(bugs) + "</tr>";
      }).join("") + "</tbody></table></div>";
  }

  var FILTERS = [["all", "All"], ["measured", "Measured"], ["code", "From code"], ["dead", "No effect"], ["live", "Live"]];
  function pageValues(filter) {
    filter = filter || "all";
    if (!FILTERS.some(function (f) { return f[0] === filter; })) return pageNotFound("list", filter);
    var rows = D.values.filter(function (v) { return filter === "all" || (filter === "live" ? v.live : v.status === filter); })
      .sort(function (a, b) { return a.name.localeCompare(b.name); });
    var text = filter === "all" ? "Every number Trait Facts stores, by trait."
      : filter === "live" ? "The mod also reads these from the running game each time it starts."
      : STATUS[filter].text;
    return '<p class="eyebrow">All values</p><h1>' + esc(filter === "all" ? "All values" : filter === "live" ? "Read live from the game" : STATUS[filter].many) + "</h1>"
      + '<p class="lede">' + rows.length + " of " + D.values.length + " values. " + esc(text) + "</p>"
      + '<div class="chips" role="group" aria-label="Filter">' + FILTERS.map(function (f) {
        return '<a href="#/values' + (f[0] === "all" ? "" : "/" + f[0]) + '"' + (f[0] === filter ? ' aria-current="true"' : "") + ">" + esc(f[1]) + "</a>";
      }).join("") + "</div>"
      + '<div class="scroll" tabindex="0" role="region" aria-label="Values"><table><caption class="sr">Values</caption>'
      + '<thead><tr><th scope="col">Trait</th><th scope="col" class="num">Value</th><th scope="col">Effect</th>'
      + (filter === "all" || filter === "live" ? '<th scope="col">Label</th>' : "") + '<th scope="col">Game code</th></tr></thead><tbody>'
      + rows.map(function (v) {
        return '<tr><th scope="row" class="nowrap"><a href="' + esc(valueHref(v)) + '">' + esc(v.name) + '</a></th><td class="num fig nowrap ' + esc(v.tone) + '">'
          + esc(v.value) + '</td><td style="min-width:13rem">' + esc(v.effect) + "</td>"
          + (filter === "all" || filter === "live" ? "<td>" + pill(v.status) + "</td>" : "")
          + '<td class="quiet">' + esc(v.code) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function pageTesting(open) {
    var html = '<p class="eyebrow">Method</p><h1>How it is tested</h1>'
      + '<p class="lede">Each number comes from one of three sources. If two disagree, the one listed first counts. Only the first happens in your game while you play. The other two were done before release, and their results ship with the mod.</p>'
      + '<div class="layers">'
      + '<div class="card"><b class="step">1</b><h3>Live from your game</h3><p class="wo">Happens in your game</p><p>Trait Facts reads the trait list the game itself has loaded: points, skill boosts, which traits exclude each other, and traits added by other mods. So changes from mods or patches show up by themselves. It reads no files on your PC, sends nothing anywhere and saves nothing.</p></div>'
      + '<div class="card"><b class="step">2</b><h3>Measured in the game</h3><p class="wo">Done before release</p><p>A separate test mod gives a character the trait, takes it away again and compares. Random effects use a fixed sample size per case, from about 100 to 20000; the size and the tolerance are given with each value. The test mod is not part of Trait Facts, is not on the Workshop and never runs on your PC.</p></div>'
      + '<div class="card"><b class="step">3</b><h3>From the game code</h3><p class="wo">Done before release</p><p>Every value starts here: the place in the game code that sets it, for build ' + esc(D.build) + ". A value that was only read and never measured carries the label From code. Line numbers refer to one reading of that build; search for the method name if yours differ.</p></div></div>";
    html += '<h2 id="proof">How strong is the evidence</h2>'
      + "<p>Every entry says next to the word Evidence how it was checked. The kinds differ in what they prove.</p>"
      + '<ul class="legend">'
      + '<li><span class="kind-key">' + esc(PROOF.hand) + "</span><span>Played by hand in the normal game, the way a player would, and written down. The strongest kind.</span></li>"
      + '<li><span class="kind-key">' + esc(PROOF.play) + "</span><span>The test mod lets the character really do it (sprint, drive, fell a tree, wait) and measures what happens, trait on against trait off.</span></li>"
      + '<li><span class="kind-key">' + esc(PROOF.call) + "</span><span>The test mod calls the game's own function on a live character and reads the result. That proves what the function computes. It does not prove by itself that normal play reaches the function. On 2026-09-21 all of these were checked for callers in the game; two entries failed that check and were corrected. On 2026-09-23 a second check found 11 more that the game reaches but that change nothing in single-player play: nine grapple values never cross the threshold the game checks, and two hearing values are read only by a multiplayer server. They are now listed as No effect.</span></li>"
      + '<li><span class="kind-key">' + esc(PROOF.code) + "</span><span>Read in the game code, not run. It shows what the code says.</span></li>"
      + "</ul>";
    if (D.why) html += '<h2 id="why">Why a test mod</h2><p>' + esc(D.why) + "</p>";
    if (D.tests.length) {
      html += '<h2 id="tests">The tests</h2>'
        + '<p>Every value links the raw test logs it rests on. The logs are in German; <a href="' + esc(D.logs) + 'README.md">this guide</a> explains the column names and how to read a line.</p>'
        + D.tests.map(function (t) {
        var rows = [["Checks", esc(t.measures)], ["How", esc(t.how)]];
        return '<article class="card" id="test-' + esc(t.id) + '"><h3>' + esc(t.name) + "</h3>"
          + '<p class="wo">' + (t.used ? "Backs " + t.used + (t.used === 1 ? " entry" : " entries") + " on this site" : "Checks the mod itself, not a single value") + "</p>"
          + proof(rows, true) + "</article>";
      }).join("");
    }
    return html;
  }

  function pageBugs() {
    // Erst die gemessenen, dann die nur gelesenen.
    var bugs = D.bugs.slice().sort(function (a, b) { return ORDER.indexOf(a.status) - ORDER.indexOf(b.status); });
    function traitLinks(b) {
      return b.traits.map(function (t) {
        var key = slug(t.key);
        return traits[key] ? '<a href="#/trait/' + esc(key) + '">' + esc(traits[key].name) + "</a>" : "<span>" + esc(t.name) + "</span>";
      }).join(", ");
    }
    return '<p class="eyebrow">Found along the way</p><h1>Game bugs</h1>'
      + '<p class="lede">Bugs and quirks: places where the game does something other than its description or the intent of its code suggests. Some you can notice in play, some are code that nothing uses. Trait Facts does not fix them. Each entry says what the mod shows.</p>'
      + '<div class="scroll" tabindex="0" role="region" aria-label="Game bugs"><table><caption class="sr">All game bugs</caption>'
      + '<thead><tr><th scope="col">Game bug</th><th scope="col">Traits</th><th scope="col">Label</th></tr></thead><tbody>'
      + bugs.map(function (b) {
        return '<tr><th scope="row"><a href="#/bugs/' + esc(b.id) + '">' + esc(b.title) + "</a></th><td>" + traitLinks(b) + "</td><td>" + pill(b.status) + "</td></tr>";
      }).join("") + "</tbody></table></div>"
      + '<h2 id="bug-cards">In detail</h2>'
      + bugs.map(function (b) {
        var rows = [];
        var affected = b.values.map(function (id) {
          var v = valueById[id];
          return v ? '<a href="' + esc(valueHref(v)) + '">' + esc(v.name + ": " + v.effect) + "</a>" : "";
        }).filter(Boolean);
        if (affected.length) rows.push(["Affects", affected.join(", ")]);
        if (b.method || b.test) rows.push(["How tested", testLink(b.test) + esc(b.method)]);
        if (b.code) rows.push(["Game code", esc(b.code)]);
        if (b.runs.length) rows.push(["Test logs", runLinks(b.runs)]);
        return '<article class="card" id="bug-' + esc(b.id) + '"><div class="row"><span class="pill bug">Game bug</span>' + pill(b.status) + dePill(b.de)
          + "<span>" + traitLinks(b) + "</span>"
          + "</div><h3>" + esc(b.title) + "</h3><p>" + esc(b.consequence) + "</p>"
          + (b.handling ? '<p class="inmod">' + esc(b.handling) + "</p>" : "")
          + proof(rows, showAll, b.proof) + "</article>";
      }).join("") + reportBox("Something here");
  }

  // --- Wege -----------------------------------------------------------------
  var first = true, lastHash = null, scrolls = {};
  try { history.scrollRestoration = "manual"; } catch (e) { /* alter Browser */ }

  function route() {
    if (lastHash != null) scrolls[lastHash] = window.scrollY;
    var h = location.hash || "#/";
    if (h === "#main") { main.focus(); return; }
    var m, html, name = "home", focus = null;
    if ((m = h.match(/^#\/trait\/([^/]+)(?:\/(.+))?/))) {
      name = "";
      html = pageTrait(m[1], m[2] ? m[1] + "/" + m[2] : null);
      if (m[2]) focus = cardId(m[1] + "/" + m[2]);
    }
    // #/status/<x> hiess die Seite bis 21.09.2026; alte Links sollen weiter gehen.
    else if ((m = h.match(/^#\/(?:values|status)(?:\/(\w+))?/))) { html = pageValues(m[1]); name = "values"; }
    else if ((m = h.match(/^#\/testing(?:\/(.+))?/))) { html = pageTesting(); name = "testing"; if (m[1]) focus = "test-" + m[1]; }
    else if ((m = h.match(/^#\/bugs(?:\/(.+))?/))) { html = pageBugs(); name = "bugs"; if (m[1]) focus = "bug-" + m[1]; }
    else if (h === "#/" || h === "#") { html = pageHome(); }
    else { html = pageNotFound("page", h.replace(/^#\/?/, "")); name = ""; }
    main.innerHTML = html + '<p class="foot">Trait Facts ' + esc(D.version) + " · Project Zomboid build " + esc(D.build)
      + (D.workshop ? ' · <a href="' + esc(D.workshop) + '">Get the mod on the Steam Workshop</a>' : "")
      + ' · <a href="' + esc(D.report) + '">Report a wrong number</a>'
      + ' · <a href="https://github.com/bluehelix-mods/trait-facts">Source on GitHub</a>'
      + " · A fan project, not affiliated with The Indie Stone.</p>";
    Array.prototype.forEach.call(document.querySelectorAll("#nav a"), function (a) {
      if (a.getAttribute("data-route") === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    markCurrent();
    var toggle = document.getElementById("toggle");
    if (toggle) toggle.onclick = function () {
      showAll = !showAll;
      try { localStorage.setItem("tf-evidence", showAll ? "1" : "0"); } catch (e) { /* ohne Speicher gilt es bis zum Neuladen */ }
      Array.prototype.forEach.call(main.querySelectorAll("details.proof"), function (d) { d.open = showAll; });
      toggle.setAttribute("aria-pressed", String(showAll));
      toggle.textContent = showAll ? "Hide evidence" : "Show all evidence";
    };
    var target = focus && document.getElementById(focus);
    if (target) {
      var d = target.querySelector("details.proof");
      if (d) d.open = true;
      target.classList.add("mark");
      target.scrollIntoView({ behavior: "auto", block: "start" });
    } else {
      window.scrollTo(0, scrolls[h] || 0);
    }
    var h1 = main.querySelector("h1");
    document.title = (h1 ? h1.textContent + " · " : "") + "Trait Facts Wiki";
    // Der Fokus geht mit: sonst beginnt die Tastatur nach jedem Klick wieder ganz oben.
    if (!first) {
      var f = target || h1;
      if (f) { f.setAttribute("tabindex", "-1"); f.focus({ preventScroll: true }); }
    }
    first = false;
    lastHash = h;
  }

  document.getElementById("stamp").textContent = D.build;
  document.getElementById("version").textContent = D.version;
  document.getElementById("skip").addEventListener("click", function (e) { e.preventDefault(); main.focus(); });
  search.addEventListener("input", renderList);
  // "/" springt ins Suchfeld, Esc leert es, Enter oeffnet den ersten Treffer. Ohne
  // sichtbaren Hinweis: das Kaestchen "/" im Feld erklaerte sich nicht selbst
  // (Rueckfrage 20.09.2026), und auf deutscher Tastatur ist es Shift+7.
  document.addEventListener("keydown", function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "");
    if (e.key === "/" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); browse.open = true; search.focus(); search.select(); }
    else if (e.key === "Escape" && document.activeElement === search) { search.value = ""; renderList(); search.blur(); }
    else if (e.key === "Enter" && document.activeElement === search) {
      var hit = list.querySelector("a.hit") || list.querySelector("a");
      if (hit && search.value.trim()) location.hash = hit.getAttribute("href");
    }
  });
  function fitList() { if (!search.value) browse.open = !narrow.matches; }
  if (narrow.addEventListener) narrow.addEventListener("change", fitList);
  fitList();
  window.addEventListener("hashchange", function () { if (narrow.matches && !search.value) browse.open = false; route(); });
  renderList();
  route();
})();
</script>
</body>
</html>
